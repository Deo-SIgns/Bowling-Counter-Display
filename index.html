<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dezerland Bowling Counter Display</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Russo+One&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0b0b0f;color:#ddd;font-family:system-ui,-apple-system,sans-serif;height:100%;overflow:hidden}
body{display:flex;flex-direction:column;justify-content:center}
#viewport{width:100%;overflow-x:auto;overflow-y:hidden;flex:none}
#stageBox{position:relative;margin:0 auto}
#stage{position:absolute;left:0;top:0;width:7680px;height:1080px;transform-origin:0 0;overflow:hidden;background:#000}
.layer{position:absolute;inset:0;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.slot{position:absolute;top:0;height:1080px;overflow:hidden}
.slot.left{left:0;width:1920px}.slot.center{left:1920px;width:3840px}.slot.right{left:5760px;width:1920px}
.slot video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;visibility:hidden;background:#000}
.slot video.on{visibility:visible}
.phwrap{position:absolute;inset:0}
#fire{position:absolute;left:0;top:0;width:7680px;height:1080px;pointer-events:none;z-index:5;display:none}
#mascotLayer{position:absolute;inset:0;z-index:10;pointer-events:none}
#bezels{position:absolute;inset:0;z-index:20;pointer-events:none}
#bezels div{position:absolute;top:0;bottom:0;width:40px;margin-left:-20px;background:#0d0d0d;box-shadow:0 0 0 3px #222}
body.nobezel #bezels{display:none}

/* ---------- UI ---------- */
#ui{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:10px}
#ui button{font:600 14px system-ui;background:#1d1d26;color:#fff;border:1px solid #3a3a4a;border-radius:8px;padding:9px 12px;cursor:pointer}
#ui button:active{background:#2c2c3a}
#status{font-size:13px;color:#999;min-width:150px;text-align:center}
#info{font-size:12px;color:#777;text-align:center;padding:0 12px 10px;line-height:1.4}
body.kiosk #ui,body.kiosk #info{display:none}
body.kiosk{cursor:none}

/* ---------- Placeholder "videos" ---------- */
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Bungee',Impact,sans-serif;text-align:center;overflow:hidden}
.tag{position:absolute;top:24px;left:28px;font:600 28px system-ui;color:rgba(255,255,255,.45);letter-spacing:2px}

.p-playcard{background:radial-gradient(ellipse at 50% 40%,#5b1fa8 0%,#24083f 55%,#0a0214 100%)}
.p-playcard .big{font-size:180px;line-height:.98;color:#fff;-webkit-text-stroke:5px #b56bff;text-shadow:0 0 30px #b56bff,0 0 80px #7a2cff;animation:glow 2.4s ease-in-out infinite;margin-top:-80px}
@keyframes glow{50%{text-shadow:0 0 10px #b56bff,0 0 40px #7a2cff;transform:scale(1.04)}}
.marquee{position:absolute;bottom:50px;left:0;white-space:nowrap;font-size:46px;color:#fff;animation:marq 16s linear infinite}
@keyframes marq{to{transform:translateX(-50%)}}

.p-burst{background:#c4121a}
.p-burst .rays{position:absolute;left:50%;top:50%;width:5200px;height:5200px;margin:-2600px 0 0 -2600px;background:repeating-conic-gradient(rgba(255,255,255,.2) 0deg 6deg,transparent 6deg 18deg);animation:spin 40s linear infinite}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,.5) 100%)}
@keyframes spin{to{transform:rotate(360deg)}}
.p-burst .big{position:relative;font-size:250px;line-height:.92;color:#ffe100;text-shadow:8px 8px 0 #000,16px 16px 0 #6a0000;animation:punch 1.6s ease-in-out infinite}
@keyframes punch{50%{transform:scale(1.06)}}

.p-arcade{background:linear-gradient(#07001a 0%,#24004a 58%,#000 58%)}
.p-arcade .sun{position:absolute;top:150px;left:50%;width:560px;height:560px;margin-left:-280px;border-radius:50%;background:repeating-linear-gradient(transparent 0 34px,#24004a 34px 44px),linear-gradient(#ffe259,#ff2bd6 70%);-webkit-mask:linear-gradient(#000 0 70%,transparent 70%);mask:linear-gradient(#000 0 70%,transparent 70%)}
.p-arcade .grid{position:absolute;left:-60%;right:-60%;top:58%;height:70%;background-image:linear-gradient(#ff2bd6 4px,transparent 4px),linear-gradient(90deg,#ff2bd6 4px,transparent 4px);background-size:140px 140px;transform:perspective(420px) rotateX(62deg);transform-origin:50% 0;animation:gridmove 1s linear infinite}
@keyframes gridmove{to{background-position:0 140px}}
.p-arcade .big{position:relative;font-size:210px;color:#fff;text-shadow:0 0 20px #00f0ff,0 0 60px #00f0ff;margin-top:-180px}
.p-arcade .sub{position:relative;font-family:'Russo One',sans-serif;font-size:84px;color:#ff2bd6;letter-spacing:18px;text-shadow:0 0 24px #ff2bd6;animation:flicker 4s infinite}
@keyframes flicker{0%,92%,96%,100%{opacity:1}94%,98%{opacity:.25}}

.p-bowling{background:linear-gradient(160deg,#002b33,#00121a 60%,#000)}
.p-bowling .big{font-size:230px;color:#fff;-webkit-text-stroke:6px #00c2c7;text-shadow:0 10px 0 #004f55;margin-top:-140px}
.p-bowling .sub{font-family:'Russo One',sans-serif;font-size:80px;color:#00e5ea;letter-spacing:30px}
.lane{position:absolute;left:0;right:0;bottom:0;height:260px;background:repeating-linear-gradient(90deg,#c98b4a 0 60px,#b77a3c 60px 120px)}
.ball{position:absolute;bottom:60px;left:0;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff5ad1,#7a00a8 60%,#30003f);animation:roll 4s linear infinite}
.ball::after{content:'';position:absolute;left:60px;top:50px;width:22px;height:22px;border-radius:50%;background:#1a0020;box-shadow:40px -6px 0 #1a0020,22px 34px 0 #1a0020}
@keyframes roll{from{transform:translateX(-260px) rotate(0)}to{transform:translateX(2200px) rotate(1080deg)}}

.p-deal{background:#1636c9}
.p-deal .stripes{position:absolute;inset:-200px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 50px,transparent 50px 100px);animation:slide 3s linear infinite}
@keyframes slide{to{transform:translateX(141px)}}
.p-deal .chev{position:absolute;top:0;bottom:0;width:120px;background:repeating-linear-gradient(-30deg,#ff3b3b 0 60px,#ffd400 60px 120px,#00c2ff 120px 180px)}
.p-deal .get{position:relative;font-size:150px;color:#ff3b3b;text-shadow:6px 6px 0 #fff}
.p-deal .amt{position:relative;font-size:340px;line-height:.85;color:#fff;text-shadow:10px 10px 0 #0a1a6a;animation:punch 1.4s ease-in-out infinite}
.p-deal .free{position:relative;font-size:180px;color:#ffd400;text-shadow:8px 8px 0 #0a1a6a;margin-top:-10px}
.p-deal .fine{position:relative;font:700 60px system-ui;color:#fff;margin-top:10px}

.p-kart{background-color:#eee;background-image:conic-gradient(#111 25%,#eee 0 50%,#111 0 75%,#eee 0);background-size:200px 200px;animation:checker 2s linear infinite}
@keyframes checker{to{background-position:400px 0}}
.p-kart .panel{background:rgba(0,0,0,.82);border:8px solid #ffd400;padding:50px 90px;border-radius:24px}
.p-kart .big{font-size:200px;color:#ffd400;line-height:1}
.p-kart .sub{font-family:'Russo One',sans-serif;font-size:60px;color:#fff;margin-top:20px}


/* ---------- Laser tag ---------- */
#ltDim{position:absolute;inset:0;background:rgba(2,0,20,.55);opacity:0}
.lt-char{position:absolute;bottom:0;height:860px;display:none;will-change:transform}
.lt-dodge,.lt-bob{position:absolute;inset:0}
.lt-bob{animation:ltbob .5s ease-in-out infinite alternate}
@keyframes ltbob{to{transform:translateY(-12px) rotate(.6deg)}}
.lt-char img{width:100%;height:100%;display:block}
.lt-gun{position:absolute;width:330px;height:187px}
.lt-gun.flip{transform:scaleX(-1)}
.lt-beam{position:absolute;left:0;top:0;width:0;height:0}
.lt-beam i{position:absolute;left:0;top:-11px;width:900px;height:22px;border-radius:11px;background:linear-gradient(90deg,transparent,var(--c) 30%,#fff 85%)}
.lt-beam i{box-shadow:0 0 30px 8px var(--c)}
.lt-burst{position:absolute;width:500px;height:500px;margin:-250px 0 0 -250px;border-radius:50%;background:radial-gradient(circle,#fff 0%,var(--c) 30%,transparent 68%)}
#ltBanner{position:absolute;left:1920px;top:90px;width:3840px;font-family:'Bungee',Impact,sans-serif;display:none}
#ltBanner .row{display:grid;grid-template-columns:1fr 170px 1fr;align-items:center}
#ltBanner .l{display:flex;justify-content:flex-end;align-items:center;gap:90px}
#ltBanner .r{display:flex;justify-content:flex-start;align-items:center;gap:90px}
#ltBanner .w{font-size:290px;line-height:1;color:#fff;text-shadow:0 0 20px #fff,0 0 60px #b400ff,0 0 140px #b400ff,10px 10px 0 #2a0050}
#ltBanner .sc{font-size:230px;line-height:1;min-width:230px;text-align:center;border:10px solid currentColor;border-radius:30px;padding:10px 20px;background:rgba(0,0,0,.6);text-shadow:0 0 40px currentColor;box-shadow:0 0 50px currentColor}
#ltBanner .sub{margin-top:26px;font-family:'Russo One',sans-serif;font-size:110px;color:#ffe100;letter-spacing:8px;text-shadow:0 0 30px #ff8a00,6px 6px 0 #000}


/* ---------- Kart rigs + overlay effects ---------- */
.rig{position:absolute;left:0;top:0;width:900px;height:720px;will-change:transform;transform-origin:190px 630px}
.rig .bob{position:absolute;inset:0;animation:bob .28s ease-in-out infinite alternate}
.rig .clip{position:absolute;overflow:hidden}
.rig .clip img{display:block;width:100%}
.rig svg{position:absolute;left:0;top:330px}
#fx{position:absolute;left:0;top:0;width:7680px;height:1080px;z-index:6;display:none;pointer-events:none}
#fxDim{position:absolute;inset:0;z-index:5;background:rgba(0,0,14,.62);opacity:0;pointer-events:none}
.surfer{position:absolute;left:0;top:0;width:470px;height:640px;will-change:transform}
.surfer img{position:absolute;left:40px;top:0;width:390px}
.surfer svg{position:absolute;left:0;top:480px}
.bn{position:absolute;left:1920px;width:3840px;z-index:2000;font-family:'Bungee',Impact,sans-serif;line-height:1;text-shadow:0 0 20px #fff,0 0 60px var(--g),0 0 140px var(--g),10px 10px 0 #000}
.bn::before{content:'';position:absolute;left:0;right:0;top:-130px;height:640px;z-index:-1;background:linear-gradient(rgba(0,0,12,.85) 55%,transparent)}
.bn .row{display:grid;grid-template-columns:1fr 170px 1fr;align-items:center}
.bn .l{display:flex;justify-content:flex-end}.bn .r{display:flex;justify-content:flex-start}
@keyframes shine{from{transform:translateX(-70%)}to{transform:translateX(70%)}}
@keyframes flag{from{transform:skewY(-2.5deg)}to{transform:skewY(2.5deg)}}
#ui select{font:600 14px system-ui;background:#1d1d26;color:#fff;border:1px solid #3a3a4a;border-radius:8px;padding:9px 10px;max-width:60vw}
/* ---------- Mascot ---------- */
#mascot{position:absolute;left:0;top:0;width:640px;height:400px;display:none;will-change:transform}
#mascot .flip,#mascot .bob{width:100%;height:100%}
#mascot .bob{animation:bob .28s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-10px)}}
#mascot img{width:100%;height:100%;object-fit:contain}
.wheel{transform-box:fill-box;transform-origin:center;animation:wspin .3s linear infinite}
@keyframes wspin{to{transform:rotate(360deg)}}
.wave{transform-box:fill-box;transform-origin:100% 100%;animation:wave .45s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-18deg)}to{transform:rotate(14deg)}}
.puff{position:absolute;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,rgba(230,230,230,.9),rgba(200,200,200,0) 70%);animation:puff .9s ease-out forwards}
@keyframes puff{to{transform:translate(var(--dx),-60px) scale(2.6);opacity:0}}
</style>
</head>

<script>

const CONFIG = {

  // How often each surprise comes up, relative to the others

  text: {

    laserTagline: ['BOOK YOUR', 'GAME TODAY!'],
    laserNames:   ['DEO', 'HOT DOG'],            // used in "DEO WINS!"
    laserWins:    'WINS!',
    bowling:      ['STRIKE!', "LET'S BOWL!"],

    flag:         ['KARTING', 'RACE TODAY!'],
    bonk:         'BONK!',

    neon:         ['ARCADE', 'BOWLING', 'KARTING', 'LASER<br>TAG'],
    takeover:     ['PLAY', 'BOWL', 'RACE', 'REPEAT!'],   // one word per TV, shown when the wall burns away
  },
  burnSeconds: 4.5,
  takeoverSeconds: 7,        // how long the full-wall message stays up during the burn
  checkMinutes: 5,           // how often to look for added, removed or replaced videos
  applyDelaySeconds: 120,    // wait this long before using a change, so GitHub has time to publish the file
};
/* =============================================================== */

const PH = {
  playcard:`<div class="ph p-playcard"><div class="big">GET YOUR<br>PLAYCARD<br>HERE</div><div class="marquee">ARCADE • BOWLING • KARTING • LASER TAG • BUMPER CARS • POOL • &nbsp;ARCADE • BOWLING • KARTING • LASER TAG • BUMPER CARS • POOL • &nbsp;</div><div class="tag">NO VIDEO YET · ADD ONE TO THE screen1 FOLDER</div></div>`,
  burst:`<div class="ph p-burst"><div class="rays"></div><div class="vig"></div><div class="big">GET<br>PLAYCARD<br>HERE</div><div class="tag">NO VIDEO YET · ADD A 3840×1080 ONE TO THE screen2 FOLDER</div></div>`,
  arcade:`<div class="ph p-arcade"><div class="sun"></div><div class="grid"></div><div class="big">ARCADE</div><div class="sub">PIXEL GAMES</div><div class="tag">NO VIDEO YET · ADD ONE TO THE screen3 FOLDER</div></div>`,
  bowling:`<div class="ph p-bowling"><div class="lane"></div><div class="ball"></div><div class="big">BOWLING</div><div class="sub">ORLANDO</div><div class="tag">SCREEN 1 · VIDEO</div></div>`,
  deal:`<div class="ph p-deal"><div class="stripes"></div><div class="chev" style="left:0"></div><div class="chev" style="right:0"></div><div class="get">GET</div><div class="amt">$100</div><div class="free">FREE</div><div class="fine">When you purchase a $200 Playcard</div><div class="tag" style="left:150px">SCREENS 2+3 · WIDE VIDEO</div></div>`,
  kart:`<div class="ph p-kart"><div class="panel"><div class="big">KARTING</div><div class="sub">PRO TRACK · CADET TRACK</div></div><div class="tag" style="color:#000">SCREEN 4 · VIDEO</div></div>`,
};



/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const rand = (a,b) => a + Math.random()*(b-a);
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const stage = $('stage');
// Clean wall view (no controls, no status lines): when the address ends in #kiosk, or automatically on a very wide screen like the four joined TVs.
const kiosk = location.hash === '#kiosk' || window.innerWidth >= 5000;
if (kiosk) document.body.classList.add('kiosk','nobezel');

/* ---------- video playlists: one folder per screen ---------- */
const cur = $('layerA');                 // the video layer (always there)
const takeover = $('layerB');            // full-wall message the burn reveals
const SLOTS = [
  { key: 'screen1', cls: 'left',   ph: 'playcard', label: 'Left TV' },
  { key: 'screen2', cls: 'center', ph: 'burst',    label: 'Middle two TVs' },
  { key: 'screen3', cls: 'right',  ph: 'arcade',   label: 'Right TV' },
];
const VIDEO_RE = /\.(mp4|m4v|webm)$/i;
cur.innerHTML = SLOTS.map(s => `<div class="slot ${s.cls}" id="slot_${s.key}"><div class="phwrap">${PH[s.ph]}</div><video muted playsinline preload="auto"></video><video muted playsinline preload="auto"></video></div>`).join('');
cur.style.zIndex = 2; takeover.style.zIndex = 1; takeover.style.display = 'none';
function renderTakeover(){ takeover.innerHTML = `<div class="ph p-burst" style="flex-direction:row"><div class="rays"></div><div class="vig"></div>${CONFIG.text.takeover.map(t => `<div class="big" style="width:1920px;font-size:300px">${t}</div>`).join('')}</div>`; }
renderTakeover();

SLOTS.forEach(s => {
  const el = $('slot_' + s.key);
  Object.assign(s, { phEl: el.querySelector('.phwrap'), v: [...el.querySelectorAll('video')], list: [], idx: -1, active: 0, fails: 0 });
  s.v.forEach(v => {
    v.addEventListener('ended', () => advance(s));
    v.addEventListener('playing', () => { if (v === s.v[s.active]) s.fails = 0; });
    v.addEventListener('error', () => { if (!v.dataset.url) return; s.lastErr = clipName(v.dataset.url); if (v === s.v[s.active]) { s.fails++; setTimeout(() => advance(s), 1500); } });
  });
});
const clipName = u => decodeURIComponent(u.split('?')[0].split('/').pop());
function setSrc(v, url){ if (v.dataset.url !== url){ v.dataset.url = url; v.src = url; v.load(); } }
function showPlaceholder(s){
  s.v.forEach(v => { v.classList.remove('on'); v.pause(); v.removeAttribute('src'); delete v.dataset.url; v.load(); });
  s.phEl.style.display = ''; s.idx = -1;
}
// Move a screen to its next clip. Two players are stacked: one plays while the other has the next clip loaded and waiting, so the switch has no black flash.
function advance(s){
  if (!s.list.length) return showPlaceholder(s);
  if (s.fails >= s.list.length){                       // every clip failed in a row (often a video decoder hiccup)
    s.fails = 0; s.errRuns = (s.errRuns || 0) + 1;
    if (!s.v.some(v => v.classList.contains('on'))) s.phEl.style.display = '';   // only show the placeholder if nothing is on screen
    setTimeout(() => advance(s), Math.min(30000, 3000 * s.errRuns));               // try again soon, backing off a little each time
    return;
  }
  const nextIdx = (s.idx + 1) % s.list.length, url = s.list[nextIdx];
  const from = s.v[s.active], to = s.v[1 - s.active];
  if (to.error) delete to.dataset.url;     // a clip that failed to load while it was waiting gets a fresh try (and is skipped if it fails again)
  setSrc(to, url);
  to.loop = s.list.length === 1;
  try { to.currentTime = 0; } catch (e) {}
  to.play().catch(() => {});
  s.active = 1 - s.active; s.idx = nextIdx; s.stuck = 0;
  to.addEventListener('playing', () => { s.errRuns = 0; }, { once: true });
  const show = () => {
    if (to !== s.v[s.active]) return;
    s.phEl.style.display = 'none'; to.classList.add('on'); from.classList.remove('on'); from.pause();
    if (s.list.length > 1) setSrc(from, s.list[(s.idx + 1) % s.list.length]);   // get the following clip ready
  };
  if (to.readyState >= 2) show(); else to.addEventListener('playing', show, { once: true });
}
function applyList(s, list){
  if (list.length === s.list.length && list.every((u, i) => u === s.list[i])) return;
  const playing = s.idx >= 0 ? s.list[s.idx] : null, v = s.v[s.active];
  s.list = list; s.fails = 0;
  s.idx = playing ? list.indexOf(playing) : -1;
  if (!list.length || !playing || v.paused || v.ended) return advance(s);   // nothing on screen yet: start now
  v.loop = false;                                                           // otherwise let the current clip finish first
  if (list.length > 1) setSrc(s.v[1 - s.active], list[(s.idx + 1) % list.length]);
}
// Where the list of videos comes from: on GitHub Pages, ask GitHub what is in the screen folders. Anywhere else, read playlist.json.
async function fetchLists(){
  const lists = { screen1: [], screen2: [], screen3: [] }, host = location.hostname;
  if (host.endsWith('.github.io')){
    const owner = host.split('.')[0], repo = location.pathname.split('/')[1] || host;
    let r = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/main?recursive=1`, { cache: 'no-store' });
    if (r.status === 404) r = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/master?recursive=1`, { cache: 'no-store' });
    if (!r.ok) throw new Error('GitHub ' + r.status);
    for (const f of (await r.json()).tree){
      const m = f.type === 'blob' && f.path.match(/^(screen[123])\/([^\/]+)$/i);
      if (m && VIDEO_RE.test(m[2])) lists[m[1].toLowerCase()].push({ path: f.path, v: f.sha.slice(0, 8) });
    }
  } else {
    const r = await fetch('playlist.json?' + Date.now());
    if (!r.ok) throw new Error('playlist.json ' + r.status);
    const j = await r.json();
    for (const k in lists) lists[k] = (j[k] || []).filter(n => VIDEO_RE.test(n)).map(n => ({ path: k + '/' + n, v: '' }));
  }
  for (const k in lists) lists[k] = lists[k].sort((a, b) => a.path.localeCompare(b.path, undefined, { numeric: true, sensitivity: 'base' }))
    .map(f => f.path.split('/').map(encodeURIComponent).join('/') + (f.v ? '?v=' + f.v : ''));
  return lists;
}
// Safety net: if a screen's clip has not moved for about 20 seconds, move that screen on to its next clip.
setInterval(() => SLOTS.forEach(s => {
  if (!s.list.length || s.idx < 0) return;
  const t = s.v[s.active].currentTime;
  if (t !== s.lastT){ s.lastT = t; s.stuck = 0; return; }
  if (++s.stuck >= 5){ s.stuck = 0; s.fails++; s.restarts = (s.restarts || 0) + 1; advance(s); }
}), 4000);
setInterval(() => { $('nowStatus').textContent = 'Now playing: ' + SLOTS.map(s => s.key + ' ' + (s.idx < 0 || !s.list.length ? 'placeholder' : `${clipName(s.list[s.idx])} (${s.idx+1} of ${s.list.length})`)
  + (s.lastErr ? ` [could not play ${s.lastErr}]` : '') + (s.restarts ? ` [${s.restarts} stall restarts]` : '')).join(' · '); }, 2000);
let lastSig = null, pendingApply = null, listNote = '';
function applyAll(lists){
  SLOTS.forEach(s => applyList(s, lists[s.key] || []));
  $('vidStatus').textContent = 'Videos found: ' + SLOTS.map(s => `${s.key} ${(lists[s.key] || []).length || 'none (placeholder)'}`).join(' · ') + listNote;
}
async function refreshLists(first){
  let lists; listNote = '';
  try { lists = await fetchLists(); try { localStorage.setItem('wallLists', JSON.stringify(lists)); } catch (e) {} }
  catch (err){
    if (first !== true) return;                    // a failed re-check changes nothing; keep playing what we have
    try { lists = JSON.parse(localStorage.getItem('wallLists')); } catch (e) {}
    listNote = lists ? ' (offline: using the last list this browser saw)' : '';
    if (!lists){ $('vidStatus').textContent = 'Could not read the video folders (' + err.message + '). Showing placeholders.'; return; }
  }
  const sig = JSON.stringify(lists);
  if (first === true){ lastSig = sig; applyAll(lists); }
  else if (sig !== lastSig){
    lastSig = sig; clearTimeout(pendingApply);
    // GitHub lists a new file a minute or so before the site can serve it, so wait before using a change.
    pendingApply = setTimeout(() => applyAll(lists), location.hostname.endsWith('.github.io') ? CONFIG.applyDelaySeconds*1000 : 0);
  }
}
refreshLists(true);
setInterval(refreshLists, CONFIG.checkMinutes*60000);

let zoom = false;
function fit(){
  const uiH = kiosk ? 0 : $('ui').offsetHeight + $('info').offsetHeight;
  const vw = innerWidth, vh = innerHeight - uiH;
  let s = Math.min(vw/7680, vh/1080);
  if (zoom && !kiosk) s = Math.max(s, Math.min(vh*0.95/1080, 0.5));
  stage.style.transform = `scale(${s})`;
  $('stageBox').style.width = 7680*s + 'px';
  $('stageBox').style.height = 1080*s + 'px';
}

function kartSVG(c){
  const wheel = (cx,cy,r) => `<g class="wheel"><circle cx="${cx}" cy="${cy}" r="${r}" fill="#111" stroke="#000" stroke-width="6"/><circle cx="${cx}" cy="${cy}" r="${r*.5}" fill="#c9c9c9" stroke="#000" stroke-width="5"/><path d="M${cx} ${cy-r*.5} V${cy+r*.5} M${cx-r*.5} ${cy} H${cx+r*.5}" stroke="#555" stroke-width="9"/></g>`;
  const steer = c.wheel ? `<line x1="700" y1="160" x2="${c.wheel[0]+4}" y2="${c.wheel[1]+20}" stroke="#222" stroke-width="14" stroke-linecap="round"/><ellipse cx="${c.wheel[0]}" cy="${c.wheel[1]}" rx="17" ry="56" fill="#222" stroke="#000" stroke-width="6" transform="rotate(-14 ${c.wheel[0]} ${c.wheel[1]})"/>` : '';
  return `<svg viewBox="0 0 900 390" width="900" height="390" xmlns="http://www.w3.org/2000/svg">
  <ellipse cx="450" cy="378" rx="400" ry="12" fill="rgba(0,0,0,.4)"/>
  <rect x="62" y="96" width="26" height="80" fill="#222"/><rect x="20" y="70" width="150" height="30" rx="8" fill="${c.accent}" stroke="#000" stroke-width="6"/>
  <rect x="14" y="252" width="60" height="22" rx="8" fill="#888" stroke="#000" stroke-width="6"/>
  ${steer}
  <path d="M60 252 L100 150 L640 150 L852 238 Q872 250 866 300 L76 312 Z" fill="${c.body}" stroke="#000" stroke-width="8" stroke-linejoin="round"/>
  <path d="M96 210 L770 222 L840 252 L80 244 Z" fill="${c.accent}"/>
  <path d="M110 172 L640 172" stroke="rgba(255,255,255,.35)" stroke-width="10" stroke-linecap="round"/>
  <circle cx="440" cy="232" r="52" fill="#fff" stroke="#000" stroke-width="6"/>
  <text x="440" y="258" font-family="Bungee,Impact,sans-serif" font-size="72" text-anchor="middle" fill="#000"${c.flip ? ' transform="translate(880,0) scale(-1,1)"' : ''}>${c.num}</text>
  ${wheel(190,300,85)}${wheel(720,315,70)}
  </svg>`;
}

/* ---------- overlay effects: fireworks + tsunami (videos keep playing underneath) ---------- */
const fx = $('fx'), FXW = 2560, FXH = 360;
fx.width = FXW; fx.height = FXH;
const xc = fx.getContext('2d');
function fxDone(){
  xc.globalCompositeOperation = 'source-over'; xc.clearRect(0,0,FXW,FXH);
  fx.style.display = 'none'; busy = false;
}
function fireworks(){
  if (busy) return; busy = true;
  const dim = $('fxDim'), D = 9000, t0 = performance.now();
  dim.animate([{opacity:0},{opacity:1}],{duration:600,fill:'forwards'});
  fx.style.display = 'block';
  let rockets = [], parts = [], nextLaunch = 0, last = t0, ended = false;
  const launch = () => rockets.push({ x: rand(60,FXW-60), y: FXH+4, vx: rand(-.3,.3), vy: -rand(4.4,6.4), hue: rand(0,360)|0, ty: rand(40,170) });
  function explode(r){
    const n = 70 + (Math.random()*60|0), ring = Math.random() < .3;
    for (let i=0;i<n;i++){
      const a = rand(0,Math.PI*2), sp = ring ? 3.3 : rand(.5,3.7);
      parts.push({ x:r.x, y:r.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, decay:rand(.011,.021), hue:r.hue + (Math.random()<.25 ? 45 : 0), r:rand(1.1,2.1) });
    }
    xc.fillStyle = `hsla(${r.hue},100%,85%,.5)`; xc.beginPath(); xc.arc(r.x,r.y,26,0,7); xc.fill();
  }
  (function frame(now){
    const t = now - t0, dt = Math.min(3, (now-last)/16.7); last = now;
    xc.globalCompositeOperation = 'destination-out'; xc.fillStyle = 'rgba(0,0,0,.17)'; xc.fillRect(0,0,FXW,FXH);
    xc.globalCompositeOperation = 'lighter';
    if (t < D-1800 && t > nextLaunch){
      const finale = t > D-4500;
      for (let i = finale ? 3 : 1; i--;) launch();
      nextLaunch = t + (finale ? rand(90,200) : rand(200,480));
    }
    rockets = rockets.filter(r => {
      r.x += r.vx*dt; r.y += r.vy*dt; r.vy += .06*dt;
      xc.fillStyle = `hsl(${r.hue},100%,85%)`; xc.fillRect(r.x-1, r.y-1, 2.4, 3.5);
      if (r.y <= r.ty || r.vy > -1){ explode(r); return false; }
      return true;
    });
    parts = parts.filter(q => {
      q.x += q.vx*dt; q.y += q.vy*dt; q.vx *= .975; q.vy = q.vy*.975 + .035*dt; q.life -= q.decay*dt;
      if (q.life <= 0) return false;
      xc.fillStyle = `hsla(${q.hue},100%,${Math.random()<.1 ? 95 : 62}%,${q.life})`;
      xc.beginPath(); xc.arc(q.x,q.y,q.r,0,7); xc.fill();
      return true;
    });
    if (!ended && t > D-1200){ ended = true; dim.animate([{opacity:1},{opacity:0}],{duration:1200,fill:'forwards'}); }
    if (t < D + 300) requestAnimationFrame(frame); else fxDone();
  })(t0);
}
function tsunami(){
  if (busy) return; busy = true;
  fx.style.display = 'block'; xc.globalCompositeOperation = 'source-over';
  const SWEEP = 3800, HOLD = 900, DRAIN = 2600, t0 = performance.now();
  const g = xc.createLinearGradient(0,0,0,FXH);
  g.addColorStop(0,'rgba(130,230,245,.93)'); g.addColorStop(.35,'rgba(22,150,218,.95)'); g.addColorStop(1,'rgba(4,48,130,.97)');
  const bubbles = Array.from({length:140}, () => ({ x:rand(0,FXW), y:rand(0,FXH), r:rand(1,4.5), s:rand(.3,1.1) }));
  const surfer = document.createElement('div');
  surfer.className = 'surfer';
  const sv = pick([{ img: IMG_DOG, w: 390, left: 40, board: 480 }, { img: IMG_DEO, w: 450, left: 20, board: 345 }]);
  surfer.innerHTML = `<img src="${sv.img}" alt="" style="width:${sv.w}px;left:${sv.left}px"><svg viewBox="0 0 470 110" width="470" height="110" style="top:${sv.board}px"><ellipse cx="235" cy="55" rx="225" ry="34" fill="#ffd400" stroke="#000" stroke-width="7"/><path d="M40 55 H430" stroke="#e01e2b" stroke-width="12" stroke-linecap="round"/></svg>`;
  $('mascotLayer').appendChild(surfer);
  const ease = p => p<.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
  (function frame(now){
    const t = now - t0;
    xc.clearRect(0,0,FXW,FXH);
    let inWater;
    if (t < SWEEP){
      const front = -180 + (FXW+520)*ease(t/SWEEP);
      const edge = y => { const k = 1 - y/FXH; return front + k*130 - 70*k*k*k + 10*Math.sin(y/22 + t/140) + 5*Math.sin(y/9 - t/90); };
      xc.fillStyle = g; xc.beginPath(); xc.moveTo(0,0);
      for (let y=0; y<=FXH; y+=6) xc.lineTo(edge(y), y);
      xc.lineTo(0,FXH); xc.closePath(); xc.fill();
      xc.fillStyle = 'rgba(255,255,255,.88)';
      for (let y=0; y<=FXH; y+=4){ xc.beginPath(); xc.arc(edge(y)+rand(-8,12), y+rand(-3,3), rand(3,10), 0, 7); xc.fill(); }
      xc.fillStyle = 'rgba(255,255,255,.6)';
      for (let i=0;i<40;i++){ const y = rand(0,FXH); xc.fillRect(edge(y)+rand(10,70), y, 3, 3); }
      surfer.style.transform = `translate(${edge(110)*3 - 330}px,${575 - sv.board + 28*Math.sin(t/210)}px) rotate(${-9 + 4*Math.sin(t/260)}deg)`;
      inWater = b => b.x < edge(b.y) - 20;
    } else {
      surfer.style.display = 'none';
      const q = Math.max(0, (t-SWEEP-HOLD)/DRAIN), level = (FXH+30)*q*q - 20;
      const surf = x => level + 9*Math.sin(x/50 + t/160) + 4*Math.sin(x/19 - t/110);
      xc.fillStyle = g; xc.beginPath(); xc.moveTo(0,FXH);
      for (let x=0; x<=FXW; x+=10) xc.lineTo(x, surf(x));
      xc.lineTo(FXW,FXH); xc.closePath(); xc.fill();
      if (q > 0){ xc.strokeStyle = 'rgba(255,255,255,.85)'; xc.lineWidth = 6; xc.beginPath(); for (let x=0; x<=FXW; x+=10) xc.lineTo(x, surf(x)); xc.stroke(); }
      xc.strokeStyle = 'rgba(255,255,255,.12)'; xc.lineWidth = 3;
      for (let k=0;k<5;k++){ xc.beginPath(); for (let x=0; x<=FXW; x+=20){ const y = 50+k*60 + 14*Math.sin(x/90 + t/400 + k*2); if (y > surf(x)) xc.lineTo(x,y); else xc.moveTo(x,y); } xc.stroke(); }
      inWater = b => b.y > surf(b.x) + 6;
    }
    xc.fillStyle = 'rgba(255,255,255,.45)';
    for (const b of bubbles){ b.y -= b.s; if (b.y < -5){ b.y = FXH+5; b.x = rand(0,FXW); } if (inWater(b)){ xc.beginPath(); xc.arc(b.x,b.y,b.r,0,7); xc.fill(); } }
    if (t < SWEEP+HOLD+DRAIN) requestAnimationFrame(frame); else { surfer.remove(); fxDone(); }
  })(t0);
}

/* ---------- burn transition ---------- */
const FW=960, FH=135, MW=480, MH=68;
const fire = $('fire'); fire.width=FW; fire.height=FH;
const fctx = fire.getContext('2d');
const maskC = document.createElement('canvas'); maskC.width=MW; maskC.height=MH;
const mctx = maskC.getContext('2d');
const fireImg = fctx.createImageData(FW,FH), maskImg = mctx.createImageData(MW,MH);
const field = new Float32Array(FW*FH);

function hash(x,y,s){ let h = Math.imul(x,374761393) ^ Math.imul(y,668265263) ^ Math.imul(s,982451653);
  h = Math.imul(h ^ (h>>>13), 1274126177); h ^= h>>>16; return (h>>>0)/4294967296; }
function vnoise(x,y,s){ const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash(xi,yi,s), b=hash(xi+1,yi,s), c=hash(xi,yi+1,s), d=hash(xi+1,yi+1,s);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v; }
function buildField(){
  const seed = (Math.random()*1e6)|0;
  const pts = [0,1,2,3].map(i => [(i*1920 + rand(300,1620))/8, rand(15,120)]);
  let mn=1e9, mx=-1e9;
  for (let y=0;y<FH;y++) for (let x=0;x<FW;x++){
    let dist = 1e9;
    for (const [px,py] of pts){ const dd = Math.hypot(x-px, y-py); if (dd<dist) dist=dd; }
    let f=0, amp=.5, fr=1/28;
    for (let o=0;o<4;o++){ f += amp*vnoise(x*fr, y*fr, seed+o); amp*=.5; fr*=2; }
    const n = dist/150*0.62 + f*0.38;
    field[y*FW+x] = n; if(n<mn)mn=n; if(n>mx)mx=n;
  }
  for (let i=0;i<field.length;i++) field[i] = (field[i]-mn)/(mx-mn);
}
let embers = [];
function renderBurn(t){
  const fd = fireImg.data;
  for (let i=0, p=0; i<field.length; i++, p+=4){
    const d = field[i] - t; let r=0,g=0,b=0,a=0;
    if (d < 0){
      if (d > -0.05){ const k = 1 + d/0.05; r=255; g=60+80*k; b=10; a=190*k*k*(0.7+Math.random()*0.3); }
    } else if (d < 0.022){
      const k = d/0.022; r=255; g=255-k*130; b=210*(1-k)*(1-k); a=255;
      if (Math.random() < 0.0025 && embers.length < 500)
        embers.push({x:i%FW, y:(i/FW)|0, vx:rand(-.4,.4), vy:rand(-1.4,-.4), life:1});
    } else if (d < 0.09){
      const k = (d-0.022)/0.068; r=35; g=15; b=4; a=235*(1-k)*(1-k*.3);
    }
    fd[p]=r; fd[p+1]=g; fd[p+2]=b; fd[p+3]=a;
  }
  fctx.putImageData(fireImg,0,0);
  drawEmbers();
  const md = maskImg.data;
  for (let y=0;y<MH;y++) for (let x=0;x<MW;x++){
    const fi = Math.min(FH-1,y*2)*FW + x*2;
    md[(y*MW+x)*4+3] = field[fi] > t ? 255 : 0;
  }
  mctx.putImageData(maskImg,0,0);
  const url = `url(${maskC.toDataURL()})`;
  burnLayer.style.webkitMaskImage = url; burnLayer.style.maskImage = url;
}
function drawEmbers(){
  embers = embers.filter(e => (e.life -= 0.02) > 0);
  for (const e of embers){
    e.x += e.vx; e.y += e.vy; e.vx += rand(-.08,.08);
    fctx.fillStyle = `rgba(255,${150+100*e.life|0},60,${e.life})`;
    fctx.fillRect(e.x, e.y, 1, 1);
  }
}
let burnLayer = cur;
function burnPass(layer){
  return new Promise(res => {
    burnLayer = layer; buildField();
    fire.style.display = 'block';
    const start = performance.now(), D = CONFIG.burnSeconds*1000;
    (function frame(now){
      const p = Math.min(1, Math.max(0, (now-start)/D));
      renderBurn(-0.03 + 1.15 * (p<.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2));
      if (p < 1) return requestAnimationFrame(frame);
      res();
    })(start);
  });
}
function burnTail(){
  return new Promise(res => {
    const t0 = performance.now();
    (function tail(n){
      fctx.clearRect(0,0,FW,FH); drawEmbers();
      if (n - t0 < 1000 && embers.length) return requestAnimationFrame(tail);
      fctx.clearRect(0,0,FW,FH); fire.style.display = 'none'; embers = []; res();
    })(t0);
  });
}
// The videos burn away to a full-wall message, then the message burns away and the videos are back. The videos never stop.
async function burn(){
  if (busy) return; busy = true;
  takeover.style.display = 'block';
  await burnPass(cur);
  takeover.style.zIndex = 2; cur.style.zIndex = 1;
  cur.style.webkitMaskImage = cur.style.maskImage = '';
  await burnTail();
  await sleep(CONFIG.takeoverSeconds*1000);
  await burnPass(takeover);
  cur.style.zIndex = 2; takeover.style.zIndex = 1; takeover.style.display = 'none';
  takeover.style.webkitMaskImage = takeover.style.maskImage = '';
  await burnTail();
  busy = false;

/* ---------- laser tag ---------- */
const CH = 860, GW = 330, GS = GW/300;
function ltSetup(id, cx, aspect, grip, chest, color, flip, name){
  const el = $(id), w = CH*aspect, x = cx - w/2, y = 1080 - CH;
  el.style.left = x+'px'; el.style.width = w+'px';
  const g = el.querySelector('.lt-gun');
  const gx = grip[0]*w, gy = grip[1]*CH;
  g.style.left = (gx - (flip ? 205 : 95)*GS)+'px'; g.style.top = (gy - 115*GS)+'px';
  return { el, dodge: el.querySelector('.lt-dodge'), color, name, score: 0,
    muzzle: [x + gx + (flip ? -201 : 201)*GS, y + gy - 63*GS],
    chest: [x + chest[0]*w, y + chest[1]*CH] };
}
const LT_A = ltSetup('ltDeo', 960, 822/753, [.882,.648], [.46,.60], '#19e6ff', false, TXT.laserNames[0]);
const LT_B = ltSetup('ltDog', 6720, 618/657, [.142,.627], [.52,.52], '#ff3b2b', true, TXT.laserNames[1]);
const ltLayer = $('laserLayer');

function ltShot(from, to, hit){
  return new Promise(res => {
    const [mx,my] = from.muzzle, [tx,ty] = to.chest;
    const dx = tx-mx, dy = ty-my, dist = Math.hypot(dx,dy), ux = dx/dist, uy = dy/dist;
    const ang = Math.atan2(dy,dx)*180/Math.PI, L = 900;
    const end = hit ? dist - L : dist + 2600;
    const beam = document.createElement('div');
    beam.className = 'lt-beam'; beam.style.setProperty('--c', from.color); beam.innerHTML = '<i></i>';
    ltLayer.appendChild(beam);
    const dur = end/11;  // px per ms
    from.dodge.animate([{transform:'translateX(0)'},{transform:`translateX(${-ux*34}px) rotate(${-ux*3}deg)`},{transform:'translateX(0)'}],{duration:220});
    ltBurst(mx, my, from.color, .45);
    if (!hit) to.dodge.animate([{transform:'translateY(0)'},{transform:'translateY(520px)',offset:.3},{transform:'translateY(520px)',offset:.65},{transform:'translateY(0)'}],{duration:900,easing:'ease-in-out'});
    const a = beam.animate([{transform:`translate(${mx}px,${my}px) rotate(${ang}deg)`},{transform:`translate(${mx+ux*end}px,${my+uy*end}px) rotate(${ang}deg)`}],{duration:dur,easing:'linear'});
    a.onfinish = () => {
      beam.remove();
      if (hit){
        ltBurst(tx, ty, from.color, 1.3);
        to.dodge.animate([{transform:'translateX(0)',filter:'brightness(4) saturate(0)'},{transform:`translateX(${ux*40}px) rotate(${ux*5}deg)`,filter:'brightness(2)'},{transform:`translateX(${-ux*24}px)`,filter:'brightness(1)'},{transform:`translateX(${ux*12}px)`},{transform:'translateX(0)',filter:'none'}],{duration:520});
        from.score++; from.scoreEl.textContent = from.score;
        from.scoreEl.animate([{transform:'scale(1.7)'},{transform:'scale(1)'}],{duration:400,easing:'ease-out'});
      }
      res();
    };
  });
}
function ltBurst(x, y, color, scale){
  const b = document.createElement('div');
  b.className = 'lt-burst'; b.style.setProperty('--c', color); b.style.left = x+'px'; b.style.top = y+'px';

  win.el.animate([{transform:'translateY(0)'},{transform:'translateY(-110px)'},{transform:'translateY(0)'}],{duration:420,iterations:4,easing:'ease-in-out'});
  await sleep(2400);
  const down = win.el.animate([{transform:'translateY(0)'},{transform:'translateY(100%)'}],{duration:450,easing:'ease-in',fill:'forwards'});
  const up = ban.animate([{transform:'translateY(0)'},{transform:'translateY(-700px)'}],{duration:450,easing:'ease-in',fill:'forwards'});
  const und = dim.animate([{opacity:1},{opacity:0}],{duration:500,fill:'forwards'});
  await sleep(520);
  A.el.style.display = B.el.style.display = ban.style.display = 'none';
  [fall, down, up].forEach(a => a.cancel());
  busy = false;

const IMG_DOGCAP = $('ltDog').querySelector('img').src;
const ART = { deo: { img: IMG_DEO, ar: 822/753 }, dog: { img: IMG_DOG, ar: 796/1063 }, dogcap: { img: IMG_DOGCAP, ar: 618/657 } };
function mk(cls, css, html){ const d = document.createElement('div'); if (cls) d.className = cls; if (css) d.style.cssText = css; if (html) d.innerHTML = html; L.appendChild(d); return d; }
const fin = (el, kf, o) => el.animate(kf, o).finished;
const fxWrap = fn => async () => { if (busy) return; busy = true; try { await fn(); } finally { busy = false; } };
const dimTo = (a, b, ms) => fin($('fxDim'), [{opacity:a},{opacity:b}], {duration:ms, fill:'forwards'});
const shake = (ms = 450, amp = 22) => [cur, L].forEach(e => e.animate([0,1,2,3,4,5].map(i => ({transform: i===5 ? 'translate(0,0)' : `translate(${rand(-amp,amp)}px,${rand(-amp,amp)}px)`})), {duration: ms}));
function showBanner(l, r, o = {}){
  const b = mk('bn', `top:${o.top ?? 110}px;color:${o.color || '#fff'};--g:${o.glow || '#b400ff'};font-size:${o.size || 250}px`,
    `<div class="row"><div class="l"><span>${l}</span></div><i></i><div class="r"><span>${r}</span></div></div>`);
  b.animate([{transform:'translateY(-800px)'},{transform:'translateY(0)'}], {duration:600, easing:POP});
  return { el: b, hide: async () => { await fin(b, [{transform:'translateY(0)'},{transform:'translateY(-800px)'}], {duration:400, easing:'ease-in', fill:'forwards'}); b.remove(); } };
}
function runParticles(dur, spawn, g = .1, drag = .99){
  return new Promise(res => {
    fx.style.display = 'block'; xc.globalCompositeOperation = 'source-over';
    let ps = [], t0 = performance.now(), last = t0;
    (function frame(now){
      const t = now - t0, dt = Math.min(3, (now-last)/16.7); last = now;
      xc.clearRect(0,0,FXW,FXH);
      if (t < dur) spawn(t, p => ps.push(p), dt);
      ps = ps.filter(p => {
        p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= drag; p.vy = p.vy*drag + g*dt; p.rot += p.vr*dt;
        if (p.y > FXH + 20) return false;
        xc.save(); xc.translate(p.x, p.y); xc.fillStyle = p.c;
        if (p.shape === 'coin'){ xc.scale(Math.abs(Math.cos(p.rot))*.85 + .15, 1); xc.beginPath(); xc.arc(0,0,p.w,0,7); xc.fill(); xc.strokeStyle = '#a86b00'; xc.lineWidth = 1.5; xc.stroke(); }
        else { xc.rotate(p.rot); const hh = p.h*Math.cos(p.rot*2.3); xc.fillRect(-p.w/2, -hh/2, p.w, hh); }
        xc.restore(); return true;
      });
      if ((t < dur || ps.length) && t < dur + 7000) requestAnimationFrame(frame);
      else { xc.clearRect(0,0,FXW,FXH); fx.style.display = 'none'; res(); }
    })(t0);
  });
}

const bowlingStrike = fxWrap(async () => {

  pins.forEach(p => { const dx = rand(-500,1300), dy = rand(-950,-250), ro = rand(-900,900);

/* Arcade invasion */
const arcadeInvasion = fxWrap(async () => {
  const PAT = ['...#.#...','..#####..','.#.###.#.','#########','#########','.#.#.#.#.','#.......#'];
  const alienSVG = c => `<svg viewBox="0 0 9 7" width="100%" height="100%" shape-rendering="crispEdges">${PAT.map((row,y) => [...row].map((ch,x) => ch === '#' ? `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${c}"/>` : '').join('')).join('')}</svg>`;
  dimTo(0, 1, 400);
  const box = mk('', 'position:absolute;left:0;top:0;width:0;height:0');
  const aliens = [], cols = ['#39ff14', '#ff2bd6'];
  for (let r = 0; r < 2; r++) for (let i = 0; i < 14; i++){
    const a = { x: 230 + i*525, y: 50 + r*230, alive: true };
    a.el = document.createElement('div');
    a.el.style.cssText = `position:absolute;left:${a.x}px;top:${a.y}px;width:252px;height:196px;filter:drop-shadow(0 0 18px ${cols[r]})`;
    a.el.innerHTML = alienSVG(cols[r]); box.appendChild(a.el); aliens.push(a);
  }
  box.animate([{transform:'translateY(-600px)'},{transform:'translateY(0)'}], {duration:500, easing:'ease-out'});
  let ox = 0, oy = 0, dir = 1, n = 0;
  const march = setInterval(() => { if (++n % 4 === 0){ oy += 34; dir = -dir; } else ox += dir*70; box.style.transform = `translate(${ox}px,${oy}px)`; }, 420);
  const H = 520, W = H*ART.deo.ar;
  const ship = mk('', `position:absolute;left:0;top:${1080-H+60}px;width:${W}px;height:${H}px`, `<img src="${IMG_DEO}" style="width:100%;height:100%">`);
  const fly = ship.animate([{transform:'translate(200px,600px)'},{transform:'translate(500px,0)', offset:.08},{transform:'translate(6700px,0)'}], {duration:6200, easing:'linear', fill:'forwards'});
  await sleep(700);
  while (aliens.some(a => a.alive)){
    const sx = 500 + 6200*Math.max(0, (fly.currentTime/6200 - .08)/.92) + W*.2;
    const t = aliens.filter(a => a.alive).sort((a,b) => Math.abs(a.x+ox-sx) - Math.abs(b.x+ox-sx))[0];
    t.alive = false;
    const ax = t.x + ox + 126, ay = t.y + oy + 98, sy = 1080 - H + 110;
    const len = Math.hypot(ax-sx, ay-sy), ang = Math.atan2(ay-sy, ax-sx)*180/Math.PI;
    const beam = mk('', `position:absolute;left:${sx}px;top:${sy-9}px;width:${len}px;height:18px;border-radius:9px;background:#fff;box-shadow:0 0 30px 8px #19e6ff;transform-origin:0 50%;transform:rotate(${ang}deg)`);
    beam.animate([{opacity:1},{opacity:0}], {duration:160, fill:'forwards'}).onfinish = () => beam.remove();
    t.el.animate([{transform:'scale(1)',opacity:1,filter:'brightness(5)'},{transform:'scale(1.9)',opacity:0}], {duration:260, fill:'forwards'});
    await sleep(190);
  }
  clearInterval(march);
  const b = showBanner(TXT.invasion[0], TXT.invasion[1], {color:'#39ff14', glow:'#00ff66', top:160});
  ship.animate([{marginTop:'0'},{marginTop:'-90px'},{marginTop:'0'}], {duration:420, iterations:5});
  await sleep(2300);
  dimTo(1, 0, 400); await b.hide();
  fly.cancel(); [box, ship].forEach(e => e.remove());
});

  await fin(b, [{transform:`translate(${bx}px,${Y}px) rotate(0)`},{transform:`translate(${bx+520}px,${Y-60}px) rotate(14deg)`, offset:.5},{transform:`translate(${bx+700}px,${Y}px) rotate(0)`}], {duration:800, easing:'ease-out', fill:'forwards'});
  await sleep(700);
  star.animate([{opacity:1},{opacity:0}], {duration:300, fill:'forwards'});
  await Promise.all([
    fin(a, [{transform:`translate(${ax-700}px,${Y}px)`},{transform:`translate(-1000px,${Y}px)`}], {duration:2000, easing:'ease-in', fill:'forwards'}),
    fin(b, [{transform:`translate(${bx+700}px,${Y}px)`},{transform:`translate(7800px,${Y}px)`}], {duration:2000, easing:'ease-in', fill:'forwards'}),
  ]);

});

const checkeredFlag = fxWrap(async () => {
  const flag = mk('', 'position:absolute;left:0;top:-250px;width:2600px;height:1600px;z-index:1200;background:conic-gradient(#111 25%,#f4f4f4 0 50%,#111 0 75%,#f4f4f4 0) 0 0/260px 260px;box-shadow:0 0 80px rgba(0,0,0,.7)');

  const Y = 335, x = p => -1400 + 9600*p, sw = p => 430*Math.sin(p*Math.PI*3), keys = Math.random() < .5 ? ['deo','dog'] : ['dog','deo'];
  const race = runDrive([
    { key: keys[0], scale: .86, x: p => x(p) + sw(p) - 250*p, y: () => Y - 40 },

  const b = showBanner(TXT.flag[0], TXT.flag[1], {color:'#ffe100', glow:'#ff2b2b', size:220});
  await race; await b.hide(); flag.remove();
});

/* Playcard swipe */
const playcardSwipe = fxWrap(async () => {
  const card = mk('', 'position:absolute;left:0;top:70px;width:1500px;height:946px;border-radius:56px;z-index:1300;overflow:hidden;filter:drop-shadow(0 0 60px #7a5cff) drop-shadow(0 30px 40px rgba(0,0,0,.5))',
    `<img src="${IMG_CARD}" alt="" style="width:100%;height:100%;display:block"><div style="position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.3) 50%,transparent 60%);animation:shine 1.6s linear infinite"></div>`);
  const D = 4600, move = card.animate([{transform:'translateX(-1800px) rotate(-8deg)'},{transform:'translateX(3000px) rotate(5deg)', offset:.5},{transform:'translateX(7900px) rotate(-6deg)'}], {duration:D, easing:'linear', fill:'forwards'});
  const cols = ['#ffd400','#ffd400','#ffb300','#ff7a00','#fff2a8'];
  await runParticles(D, (t, add, dt) => {
    const p = t/D, cxp = (-1800 + 9700*p + 400)/3;
    for (let i = 0; i < 7*dt; i++){ const coin = Math.random() < .6;
      add({ x: cxp + rand(-120,220), y: rand(60,330), vx: rand(-5,1), vy: rand(-6,1), rot: rand(0,6), vr: rand(-.25,.25), w: coin ? rand(5,9) : rand(14,22), h: rand(7,10), c: coin ? pick(cols) : pick(['#ff6a00','#ff3b6b','#19c2ff']), shape: coin ? 'coin' : 'rect' }); }
  }, .16);
  move.cancel(); card.remove();
});

/* Confetti cannons */
const confetti = fxWrap(async () => {
  const cols = ['#ff3b3b','#ffd400','#19e6ff','#39ff14','#ff2bd6','#fff','#7a5cff'];
  const one = (x, y, a0, a1, v0, v1) => { const a = rand(a0,a1), v = rand(v0,v1); return { x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v, rot: rand(0,6), vr: rand(-.3,.3), w: rand(5,11), h: rand(8,14), c: pick(cols), shape: 'rect' }; };
  await runParticles(1500, (t, add, dt) => {
    const n = (t < 250 || (t > 700 && t < 950)) ? 26*dt : 3*dt;
    for (let i = 0; i < n; i++){
      add(one(0, FXH*.8, -1.25, -.25, 8, 34)); add(one(FXW, FXH*.8, Math.PI+.25, Math.PI+1.25, 8, 34));
      if (i % 2 === 0){ add(one(pick([640,1280,1920]) + rand(-30,30), FXH, -2.2, -.95, 6, 17)); }
    }
  }, .12, .975);
});

/* Glitch */
const glitch = fxWrap(async () => {
  const ov = mk('', 'position:absolute;inset:0;z-index:3000;overflow:hidden;background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 4px,transparent 4px 9px)');
  const layer = cur, t0 = performance.now(), colsG = ['rgba(0,255,255,.4)','rgba(255,0,255,.4)','rgba(255,255,255,.22)','#000','rgba(57,255,20,.3)'];
  while (performance.now() - t0 < 1400){
    ov.innerHTML = Array.from({length:12}, () => `<i style="position:absolute;left:${rand(-300,300)}px;top:${rand(0,1080)}px;width:${rand(1500,8000)}px;height:${rand(14,170)}px;background:${pick(colsG)};mix-blend-mode:${pick(['screen','difference','normal'])}"></i>`).join('');
    layer.style.transform = `translate(${rand(-70,70)}px,${rand(-14,14)}px) skewX(${rand(-4,4)}deg)`;

/* Screen crack */
const screenCrack = fxWrap(async () => {
  const k = Math.floor(rand(0,4)), cx = 960, cy = 520, who = ART[pick(['deo','dog'])];
  const H = 900, W = H*who.ar;
  const ch = mk('', `position:absolute;left:${k*1920 + cx - W/2}px;top:${cy - H/2 + 40}px;width:${W}px;height:${H}px;z-index:1400`, `<img src="${who.img}" style="width:100%;height:100%">`);
  await fin(ch, [{transform:'scale(.04) rotate(-200deg)'},{transform:'scale(1.12) rotate(0)'}], {duration:650, easing:'ease-in', fill:'forwards'});
  ch.animate([{transform:'scale(1.25,.95)'},{transform:'scale(1.12)'}], {duration:300, fill:'forwards'});
  shake(500, 30);
  let paths = '';
  for (let i = 0; i < 15; i++){
    let a = i/15*Math.PI*2 + rand(-.15,.15), x = cx, y = cy, d = `M${x} ${y}`; const steps = Math.floor(rand(4,9));
    for (let s = 0; s < steps; s++){ a += rand(-.35,.35); const len = rand(70,190); x += Math.cos(a)*len; y += Math.sin(a)*len; d += `L${x.toFixed(0)} ${y.toFixed(0)}`;
      if (Math.random() < .35){ const a2 = a + rand(.5,1.1)*(Math.random()<.5?-1:1), l2 = rand(60,180); d += `M${x.toFixed(0)} ${y.toFixed(0)}L${(x+Math.cos(a2)*l2).toFixed(0)} ${(y+Math.sin(a2)*l2).toFixed(0)}M${x.toFixed(0)} ${y.toFixed(0)}`; } }
    paths += `<path d="${d}"/>`;
  }
  for (const r of [120, 260, 430]){ let d = ''; for (let i = 0; i <= 15; i++){ const t = i/15*Math.PI*2, rr = r*rand(.85,1.15); d += (i && Math.random() < .75 ? 'L' : 'M') + (cx+Math.cos(t)*rr).toFixed(0) + ' ' + (cy+Math.sin(t)*rr).toFixed(0); } paths += `<path d="${d}"/>`; }
  const crack = mk('', `position:absolute;left:${k*1920}px;top:0;width:1920px;height:1080px;overflow:hidden;z-index:1450`,
    `<svg viewBox="0 0 1920 1080" width="1920" height="1080" fill="none" stroke-linejoin="bevel"><g stroke="rgba(0,0,0,.55)" stroke-width="12" transform="translate(4,5)">${paths}</g><g stroke="#fff" stroke-width="5">${paths}</g></svg><div style="position:absolute;inset:0;background:radial-gradient(circle at ${cx}px ${cy}px,rgba(255,255,255,.35),transparent 45%)"></div>`);
  crack.animate([{opacity:0, transform:'scale(.6)'},{opacity:1, transform:'scale(1)'}], {duration:140});
  await sleep(1500);
  await fin(ch, [{transform:'scale(1.12) translateY(0) rotate(0)'},{transform:'scale(1.12) translateY(1300px) rotate(8deg)'}], {duration:1500, easing:'cubic-bezier(.5,0,.9,.4)', fill:'forwards'});
  await fin(crack, [{opacity:1},{opacity:0}], {duration:900, fill:'forwards'});
  [ch, crack].forEach(e => e.remove());
});

const blackout = fxWrap(async () => {
  const dimEl = $('fxDim'), old = dimEl.style.background; dimEl.style.background = 'rgba(0,0,8,.96)';
  await fin(dimEl, [{opacity:0},{opacity:1},{opacity:.3},{opacity:1},{opacity:.6},{opacity:1}], {duration:520, fill:'forwards'});
  const signs = ['#19e6ff','#ff2bd6','#ffe100','#39ff14'].map((c, i) => [TXT.neon[i], c]);
  const order = [0,1,2,3].sort(() => Math.random() - .5), els = [];
  await sleep(500);
  for (const i of order){
    const [txt, c] = signs[i];
    const s = mk('', `position:absolute;left:${i*1920+160}px;top:190px;width:1600px;height:700px;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Bungee,Impact,sans-serif;font-size:${txt.length > 8 ? 250 : 270}px;line-height:1;color:#fff;border:16px solid ${c};border-radius:70px;text-shadow:0 0 20px #fff,0 0 50px ${c},0 0 120px ${c};box-shadow:0 0 60px ${c},inset 0 0 60px ${c};opacity:0`, txt);
    s.animate([{opacity:0},{opacity:1},{opacity:.15},{opacity:1},{opacity:.4},{opacity:1}], {duration:520, fill:'forwards'});
    els.push(s); await sleep(650);
  }
  els.forEach(s => s.animate([{opacity:1},{opacity:.75},{opacity:1}], {duration:rand(700,1300), iterations:3, delay:520}));
  await sleep(2600);
  els.forEach(s => s.animate([{opacity:1},{opacity:0}], {duration:300, fill:'forwards'}));
  await fin(dimEl, [{opacity:1},{opacity:0}], {duration:500, fill:'forwards'});
  dimEl.style.background = old; els.forEach(s => s.remove());
});

/* Peek */
const peek = fxWrap(async () => {
  const who = ART[pick(['deo','dogcap'])], H = 780, W = H*who.ar, mode = pick(['bottom','bottom','left','right']);
  let css, from, to, rot = 0;
  if (mode === 'bottom'){ const k = Math.floor(rand(0,4)); css = `left:${k*1920 + rand(150, 1770 - W)}px;top:${1080-H}px`; from = 'translateY(800px)'; to = 'translateY(330px)'; }
  else if (mode === 'left'){ css = `left:0;top:230px`; rot = 55; from = `translateX(${-W-200}px)`; to = `translateX(${-W*.42}px)`; }
  else { css = `left:${7680-W}px;top:230px`; rot = -55; from = `translateX(${W+200}px)`; to = `translateX(${W*.42}px)`; }
  const el = mk('', `position:absolute;${css};width:${W}px;height:${H}px;z-index:1100`, `<img src="${who.img}" style="width:100%;height:100%">`);
  await fin(el, [{transform:`${from} rotate(${rot}deg)`},{transform:`${to} rotate(${rot}deg)`}], {duration:700, easing:POP, fill:'forwards'});
  await fin(el, [{transform:`${to} rotate(${rot}deg)`},{transform:`${to} rotate(${rot-9}deg)`},{transform:`${to} rotate(${rot+9}deg)`},{transform:`${to} rotate(${rot-6}deg)`},{transform:`${to} rotate(${rot}deg)`}], {duration:1900, easing:'ease-in-out', fill:'forwards'});
  await fin(el, [{transform:`${to} rotate(${rot}deg)`},{transform:`${from} rotate(${rot}deg)`}], {duration:350, easing:'ease-in', fill:'forwards'});
  el.remove();
});

/* Pit stop */
const pitStop = fxWrap(async () => {
  const k = pick([1,2,3]), sx = k*1920 + 40, Y = 335, rig = makeRig('dog');
  await fin(rig, [{transform:`translate(-960px,${Y}px)`},{transform:`translate(${sx}px,${Y}px)`}], {duration:2600, easing:'cubic-bezier(.1,.7,.3,1)', fill:'forwards'});
  const sign = mk('', `position:absolute;left:${sx+930}px;top:150px;width:900px;padding:50px 30px;z-index:1200;text-align:center;font-family:Bungee,Impact,sans-serif;color:#fff;background:#b3121a;border:14px solid #ffd400;border-radius:50px;box-shadow:0 0 70px #ff8a00,0 30px 50px rgba(0,0,0,.5)`,
    `<div style="font-size:70px;color:#ffd400">${TXT.pitstop[0]}</div><div style="font-size:150px;line-height:1.05;margin:20px 0;text-shadow:8px 8px 0 #000">${TXT.pitstop[1]}</div><div style="font:700 62px system-ui">${TXT.pitstop[2]}</div>`);
  await fin(sign, [{transform:'scale(.1) rotate(-12deg)'},{transform:'scale(1) rotate(0)'}], {duration:450, easing:POP});
  sign.animate([{transform:'rotate(-2deg)'},{transform:'rotate(2deg)'}], {duration:700, iterations:5, direction:'alternate', easing:'ease-in-out'});
  await sleep(3400);
  await fin(sign, [{transform:'scale(1)'},{transform:'scale(0)'}], {duration:250, fill:'forwards'});
  await fin(rig, [{transform:`translate(${sx}px,${Y}px) rotate(0)`},{transform:`translate(${sx+500}px,${Y}px) rotate(-12deg)`, offset:.25},{transform:`translate(8000px,${Y}px) rotate(0)`}], {duration:1900, easing:'ease-in', fill:'forwards'});
  [rig, sign].forEach(e => e.remove());
});

/* Deo flyby with a tow banner */
const deoFlyby = fxWrap(async () => {
  const H = 600, W = H*ART.deo.ar, y = rand(130, 300);
  const el = mk('', `position:absolute;left:0;top:${y}px;width:2900px;height:640px;z-index:1250`,
    `<div style="position:absolute;left:0;top:190px;width:2050px;height:290px;background:#ffd400;border:12px solid #000;border-radius:16px;display:flex;align-items:center;justify-content:center;font-family:Bungee,Impact,sans-serif;font-size:150px;color:#e01e2b;text-shadow:5px 5px 0 #000;transform-origin:100% 50%;animation:flag 1s ease-in-out infinite alternate">${TXT.flyby}</div>
     <svg style="position:absolute;left:2040px;top:180px" width="340" height="310"><path d="M10 20 L330 150 M10 290 L330 160" stroke="#222" stroke-width="9"/></svg>
     <img src="${IMG_DEO}" style="position:absolute;left:2240px;top:20px;width:${W}px;height:${H}px;transform:rotate(72deg)">`);
  await fin(el, [0,.25,.5,.75,1].map((p,i) => ({transform:`translate(${-3100 + 11000*p}px,${[0,-70,30,-50,10][i]}px)`, offset:p})), {duration:9000, easing:'linear', fill:'forwards'});
  el.remove();
});

/* ---------- wording from text.txt ---------- */
// text.txt sits next to this page. Each line is  name = words.  A | splits the words into parts; " / " starts a new line.
const TEXT_KEYS = { laser_title: 'laserTitle', laser_tagline: 'laserTagline', laser_names: 'laserNames', laser_wins: 'laserWins', bowling: 'bowling', high_score: 'invasion',
  karting: 'flag', bonk: 'bonk', flyby_banner: 'flyby', pitstop_sign: 'pitstop', playcard: null, neon_signs: 'neon', burn_message: 'takeover' };
const escText = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\s+\/\s+/g, '<br>');
async function loadText(){
  let note = 'Wording: built in (no text.txt found)';
  try {
    const r = await fetch('text.txt?' + Date.now(), { cache: 'no-store' });
    if (r.ok){
      const bad = []; let n = 0;
      for (const raw of (await r.text()).split(/\r?\n/)){
        const line = raw.trim(); if (!line || line.startsWith('#')) continue;
        const eq = line.indexOf('='); if (eq < 0){ bad.push(line.slice(0, 20)); continue; }
        const name = line.slice(0, eq).trim().toLowerCase(), key = TEXT_KEYS[name], val = line.slice(eq + 1).trim();
        if (key === null) continue;                              // an old line that is no longer used
        if (!key){ bad.push(line.slice(0, eq).trim()); continue; }
        if (!val) continue;                                     // blank value: keep the built-in words
        const parts = val.split('|').map(p => escText(p.trim()));
        if (Array.isArray(TXT[key])) TXT[key] = TXT[key].map((old, i) => parts[i] || old);   // missing parts keep the built-in words
        else TXT[key] = parts[0];
        n++;
      }
      renderTakeover();
      note = `Wording: ${n} lines from text.txt` + (bad.length ? ` · not recognised: ${bad.join(', ')}` : '');
    }
  } catch (e) {}
  $('txtStatus').textContent = note;
}
loadText();
setInterval(loadText, CONFIG.checkMinutes*60000);

/* ---------- random scheduler ---------- */
const EVENTS = { drive: driveMascot, laser: laserTag, bowling: bowlingStrike, invasion: arcadeInvasion, bumper: bumperCars, pitstop: pitStop,
  flyby: deoFlyby, flag: checkeredFlag, playcard: playcardSwipe, peek, tsunami, fireworks, burn, crack: screenCrack, confetti, blackout, glitch };
const LABELS = { drive: '🏎️ Kart drive (solo / race / chase)', laser: '🔫 Laser tag battle', bowling: '🎳 Bowling strike', invasion: '👾 Arcade invasion', bumper: '💥 Bumper cars',
  pitstop: '🌭 Pit stop', flyby: '🦸 Deo flyby banner', flag: '🏁 Checkered flag', playcard: '💳 Playcard swipe', peek: '👀 Peek', tsunami: '🌊 Tsunami', fireworks: '🎆 Fireworks',
  burn: '🔥 Burn to message and back', crack: '🪟 Screen crack', confetti: '🎉 Confetti cannons', blackout: '💡 Blackout + neon', glitch: '📺 Glitch' };
function randomEvent(){
  const w = CONFIG.weights, total = Object.values(w).reduce((a,b) => a+b, 0);
  if (!total) return;                                   // every effect switched off
  let r = Math.random() * total;
  for (const k in w){ if ((r -= w[k]) < 0) return EVENTS[k](); }
}
let nextAt = 0;
const schedule = () => nextAt = Date.now() + rand(CONFIG.minGap, CONFIG.maxGap)*1000;

/* ---------- which effects run, from effects.txt ---------- */
const BUILTIN_WEIGHTS = { ...CONFIG.weights }, BUILTIN_GAP = [CONFIG.minGap, CONFIG.maxGap];
async function loadEffects(){
  let note = 'Effects: all on (no effects.txt found)';
  try {
    const r = await fetch('effects.txt?' + Date.now(), { cache: 'no-store' });
    if (r.ok){
      const w = {}, bad = []; let gap = null;
      for (const raw of (await r.text()).split(/\r?\n/)){
        const line = raw.replace(/#.*/, '').trim(); if (!line) continue;    // # turns a line (or the rest of it) off
        const m = line.match(/^([a-z_]+)\s*(?:=\s*(.*))?$/i);
        if (!m){ bad.push(line.slice(0, 20)); continue; }
        const name = m[1].toLowerCase(), val = (m[2] || '').trim();
        if (name === 'minutes_between'){
          const g = val.match(/^([\d.]+)\s*(?:-|to)\s*([\d.]+)$/i) || val.match(/^([\d.]+)$/);
          if (g){ const a = +g[1], b = +(g[2] || g[1]); gap = [Math.min(a, b) * 60, Math.max(a, b) * 60]; } else bad.push(name);
          continue;
        }
        if (!(name in EVENTS)){ bad.push(name); continue; }
        const n = val === '' ? (BUILTIN_WEIGHTS[name] || 5) : parseFloat(val);
        if (isNaN(n) || n < 0){ bad.push(name); continue; }
        w[name] = n;
      }
      CONFIG.weights = w;
      const old = [CONFIG.minGap, CONFIG.maxGap];
      [CONFIG.minGap, CONFIG.maxGap] = gap || BUILTIN_GAP;
      if (old[0] !== CONFIG.minGap || old[1] !== CONFIG.maxGap) schedule();
      const on = Object.keys(w).filter(k => w[k] > 0);
      note = `Effects: ${on.length} on${on.length ? '' : ' (nothing will play)'} · every ${(CONFIG.minGap/60).toFixed(1)}–${(CONFIG.maxGap/60).toFixed(1)} min` + (bad.length ? ` · not recognised: ${bad.join(', ')}` : '');
    }
  } catch (e) {}
  $('fxStatus').textContent = note;
}
loadEffects();
setInterval(loadEffects, CONFIG.checkMinutes*60000);
schedule();
setInterval(() => {
  const left = Math.max(0, Math.ceil((nextAt-Date.now())/1000));
  $('status').textContent = busy ? 'Surprise in progress…' : `Next random surprise in ${left}s`;
  if (!busy && Date.now() >= nextAt){
    randomEvent();
    schedule();
  }
}, 250);

/* ---------- buttons ---------- */
let queued = null;
setInterval(() => { if (queued && !busy){ const f = queued; queued = null; f(); schedule(); } }, 100);
$('selFx').innerHTML = Object.keys(EVENTS).map(k => `<option value="${k}">${LABELS[k]}</option>`).join('');
$('bPlay').onclick = () => { queued = EVENTS[$('selFx').value]; };
$('bZoom').onclick = () => { zoom = !zoom; $('bZoom').textContent = zoom ? '🔍 Fit' : '🔍 Zoom'; fit(); };
$('bBez').onclick = () => { const off = document.body.classList.toggle('nobezel'); $('bBez').textContent = 'Bezels: ' + (off?'off':'on'); };
setTimeout(driveMascot, 1500); // show it off right away
</script>
