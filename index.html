<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dezerland 4-Screen Wall — Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Russo+One&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0b0b0f;color:#ddd;font-family:system-ui,-apple-system,sans-serif;height:100%;overflow:hidden}
body{display:flex;flex-direction:column;justify-content:center}
#viewport{width:100%;overflow-x:auto;overflow-y:hidden;flex:none}
#stageBox{position:relative;margin:0 auto}
#stage{position:absolute;left:0;top:0;width:7680px;height:1080px;transform-origin:0 0;overflow:hidden;background:#000}
.layer{position:absolute;inset:0;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.slot{position:absolute;top:0;height:1080px;overflow:hidden}
.slot.left{left:0;width:1920px}.slot.center{left:1920px;width:3840px}.slot.right{left:5760px;width:1920px}
.slot video{width:100%;height:100%;object-fit:cover;display:block}
#fire{position:absolute;left:0;top:0;width:7680px;height:1080px;pointer-events:none;z-index:5;display:none}
#mascotLayer{position:absolute;inset:0;z-index:10;pointer-events:none}
#bezels{position:absolute;inset:0;z-index:20;pointer-events:none}
#bezels div{position:absolute;top:0;bottom:0;width:40px;margin-left:-20px;background:#0d0d0d;box-shadow:0 0 0 3px #222}
body.nobezel #bezels{display:none}

/* ---------- UI ---------- */
#ui{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:10px}
#ui button{font:600 14px system-ui;background:#1d1d26;color:#fff;border:1px solid #3a3a4a;border-radius:8px;padding:9px 12px;cursor:pointer}
#ui button:active{background:#2c2c3a}
#status{font-size:13px;color:#999;min-width:150px;text-align:center}
#info{font-size:12px;color:#777;text-align:center;padding:0 12px 10px;line-height:1.4}
body.kiosk #ui,body.kiosk #info{display:none}
body.kiosk{cursor:none}

/* ---------- Placeholder "videos" ---------- */
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Bungee',Impact,sans-serif;text-align:center;overflow:hidden}
.tag{position:absolute;top:24px;left:28px;font:600 28px system-ui;color:rgba(255,255,255,.45);letter-spacing:2px}

.p-playcard{background:radial-gradient(ellipse at 50% 40%,#5b1fa8 0%,#24083f 55%,#0a0214 100%)}
.p-playcard .big{font-size:180px;line-height:.98;color:#fff;-webkit-text-stroke:5px #b56bff;text-shadow:0 0 30px #b56bff,0 0 80px #7a2cff;animation:glow 2.4s ease-in-out infinite;margin-top:-80px}
@keyframes glow{50%{text-shadow:0 0 10px #b56bff,0 0 40px #7a2cff;transform:scale(1.04)}}
.marquee{position:absolute;bottom:50px;left:0;white-space:nowrap;font-size:46px;color:#fff;animation:marq 16s linear infinite}
@keyframes marq{to{transform:translateX(-50%)}}

.p-burst{background:#c4121a}
.p-burst .rays{position:absolute;left:50%;top:50%;width:5200px;height:5200px;margin:-2600px 0 0 -2600px;background:repeating-conic-gradient(rgba(255,255,255,.2) 0deg 6deg,transparent 6deg 18deg);animation:spin 40s linear infinite}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,.5) 100%)}
@keyframes spin{to{transform:rotate(360deg)}}
.p-burst .big{position:relative;font-size:250px;line-height:.92;color:#ffe100;text-shadow:8px 8px 0 #000,16px 16px 0 #6a0000;animation:punch 1.6s ease-in-out infinite}
@keyframes punch{50%{transform:scale(1.06)}}

.p-arcade{background:linear-gradient(#07001a 0%,#24004a 58%,#000 58%)}
.p-arcade .sun{position:absolute;top:150px;left:50%;width:560px;height:560px;margin-left:-280px;border-radius:50%;background:repeating-linear-gradient(transparent 0 34px,#24004a 34px 44px),linear-gradient(#ffe259,#ff2bd6 70%);-webkit-mask:linear-gradient(#000 0 70%,transparent 70%);mask:linear-gradient(#000 0 70%,transparent 70%)}
.p-arcade .grid{position:absolute;left:-60%;right:-60%;top:58%;height:70%;background-image:linear-gradient(#ff2bd6 4px,transparent 4px),linear-gradient(90deg,#ff2bd6 4px,transparent 4px);background-size:140px 140px;transform:perspective(420px) rotateX(62deg);transform-origin:50% 0;animation:gridmove 1s linear infinite}
@keyframes gridmove{to{background-position:0 140px}}
.p-arcade .big{position:relative;font-size:210px;color:#fff;text-shadow:0 0 20px #00f0ff,0 0 60px #00f0ff;margin-top:-180px}
.p-arcade .sub{position:relative;font-family:'Russo One',sans-serif;font-size:84px;color:#ff2bd6;letter-spacing:18px;text-shadow:0 0 24px #ff2bd6;animation:flicker 4s infinite}
@keyframes flicker{0%,92%,96%,100%{opacity:1}94%,98%{opacity:.25}}

.p-bowling{background:linear-gradient(160deg,#002b33,#00121a 60%,#000)}
.p-bowling .big{font-size:230px;color:#fff;-webkit-text-stroke:6px #00c2c7;text-shadow:0 10px 0 #004f55;margin-top:-140px}
.p-bowling .sub{font-family:'Russo One',sans-serif;font-size:80px;color:#00e5ea;letter-spacing:30px}
.lane{position:absolute;left:0;right:0;bottom:0;height:260px;background:repeating-linear-gradient(90deg,#c98b4a 0 60px,#b77a3c 60px 120px)}
.ball{position:absolute;bottom:60px;left:0;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff5ad1,#7a00a8 60%,#30003f);animation:roll 4s linear infinite}
.ball::after{content:'';position:absolute;left:60px;top:50px;width:22px;height:22px;border-radius:50%;background:#1a0020;box-shadow:40px -6px 0 #1a0020,22px 34px 0 #1a0020}
@keyframes roll{from{transform:translateX(-260px) rotate(0)}to{transform:translateX(2200px) rotate(1080deg)}}

.p-deal{background:#1636c9}
.p-deal .stripes{position:absolute;inset:-200px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 50px,transparent 50px 100px);animation:slide 3s linear infinite}
@keyframes slide{to{transform:translateX(141px)}}
.p-deal .chev{position:absolute;top:0;bottom:0;width:120px;background:repeating-linear-gradient(-30deg,#ff3b3b 0 60px,#ffd400 60px 120px,#00c2ff 120px 180px)}
.p-deal .get{position:relative;font-size:150px;color:#ff3b3b;text-shadow:6px 6px 0 #fff}
.p-deal .amt{position:relative;font-size:340px;line-height:.85;color:#fff;text-shadow:10px 10px 0 #0a1a6a;animation:punch 1.4s ease-in-out infinite}
.p-deal .free{position:relative;font-size:180px;color:#ffd400;text-shadow:8px 8px 0 #0a1a6a;margin-top:-10px}
.p-deal .fine{position:relative;font:700 60px system-ui;color:#fff;margin-top:10px}

.p-kart{background-color:#eee;background-image:conic-gradient(#111 25%,#eee 0 50%,#111 0 75%,#eee 0);background-size:200px 200px;animation:checker 2s linear infinite}
@keyframes checker{to{background-position:400px 0}}
.p-kart .panel{background:rgba(0,0,0,.82);border:8px solid #ffd400;padding:50px 90px;border-radius:24px}
.p-kart .big{font-size:200px;color:#ffd400;line-height:1}
.p-kart .sub{font-family:'Russo One',sans-serif;font-size:60px;color:#fff;margin-top:20px}


/* ---------- Laser tag ---------- */
#ltDim{position:absolute;inset:0;background:rgba(2,0,20,.55);opacity:0}
.lt-char{position:absolute;bottom:0;height:860px;display:none;will-change:transform}
.lt-dodge,.lt-bob{position:absolute;inset:0}
.lt-bob{animation:ltbob .5s ease-in-out infinite alternate}
@keyframes ltbob{to{transform:translateY(-12px) rotate(.6deg)}}
.lt-char img{width:100%;height:100%;display:block}
.lt-gun{position:absolute;width:330px;height:187px}
.lt-gun.flip{transform:scaleX(-1)}
.lt-beam{position:absolute;left:0;top:0;width:0;height:0}
.lt-beam i{position:absolute;left:0;top:-11px;width:900px;height:22px;border-radius:11px;background:linear-gradient(90deg,transparent,var(--c) 30%,#fff 85%)}
.lt-beam i{box-shadow:0 0 30px 8px var(--c)}
.lt-burst{position:absolute;width:500px;height:500px;margin:-250px 0 0 -250px;border-radius:50%;background:radial-gradient(circle,#fff 0%,var(--c) 30%,transparent 68%)}
#ltBanner{position:absolute;left:1920px;top:90px;width:3840px;font-family:'Bungee',Impact,sans-serif;display:none}
#ltBanner .row{display:grid;grid-template-columns:1fr 170px 1fr;align-items:center}
#ltBanner .l{display:flex;justify-content:flex-end;align-items:center;gap:90px}
#ltBanner .r{display:flex;justify-content:flex-start;align-items:center;gap:90px}
#ltBanner .w{font-size:290px;line-height:1;color:#fff;text-shadow:0 0 20px #fff,0 0 60px #b400ff,0 0 140px #b400ff,10px 10px 0 #2a0050}
#ltBanner .sc{font-size:230px;line-height:1;min-width:230px;text-align:center;border:10px solid currentColor;border-radius:30px;padding:10px 20px;background:rgba(0,0,0,.6);text-shadow:0 0 40px currentColor;box-shadow:0 0 50px currentColor}
#ltBanner .sub{margin-top:26px;font-family:'Russo One',sans-serif;font-size:110px;color:#ffe100;letter-spacing:8px;text-shadow:0 0 30px #ff8a00,6px 6px 0 #000}


/* ---------- Kart rigs + overlay effects ---------- */
.rig{position:absolute;left:0;top:0;width:900px;height:720px;will-change:transform;transform-origin:190px 630px}
.rig .bob{position:absolute;inset:0;animation:bob .28s ease-in-out infinite alternate}
.rig .clip{position:absolute;overflow:hidden}
.rig .clip img{display:block;width:100%}
.rig svg{position:absolute;left:0;top:330px}
#fx{position:absolute;left:0;top:0;width:7680px;height:1080px;z-index:6;display:none;pointer-events:none}
#fxDim{position:absolute;inset:0;z-index:5;background:rgba(0,0,14,.62);opacity:0;pointer-events:none}
.surfer{position:absolute;left:0;top:0;width:470px;height:640px;will-change:transform}
.surfer img{position:absolute;left:40px;top:0;width:390px}
.surfer svg{position:absolute;left:0;top:480px}
.bn{position:absolute;left:1920px;width:3840px;z-index:2000;font-family:'Bungee',Impact,sans-serif;line-height:1;text-shadow:0 0 20px #fff,0 0 60px var(--g),0 0 140px var(--g),10px 10px 0 #000}
.bn::before{content:'';position:absolute;left:0;right:0;top:-130px;height:640px;z-index:-1;background:linear-gradient(rgba(0,0,12,.85) 55%,transparent)}
.bn .row{display:grid;grid-template-columns:1fr 170px 1fr;align-items:center}
.bn .l{display:flex;justify-content:flex-end}.bn .r{display:flex;justify-content:flex-start}
@keyframes flag{from{transform:skewY(-2.5deg)}to{transform:skewY(2.5deg)}}
#ui select{font:600 14px system-ui;background:#1d1d26;color:#fff;border:1px solid #3a3a4a;border-radius:8px;padding:9px 10px;max-width:60vw}
/* ---------- Mascot ---------- */
#mascot{position:absolute;left:0;top:0;width:640px;height:400px;display:none;will-change:transform}
#mascot .flip,#mascot .bob{width:100%;height:100%}
#mascot .bob{animation:bob .28s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-10px)}}
#mascot img{width:100%;height:100%;object-fit:contain}
.wheel{transform-box:fill-box;transform-origin:center;animation:wspin .3s linear infinite}
@keyframes wspin{to{transform:rotate(360deg)}}
.wave{transform-box:fill-box;transform-origin:100% 100%;animation:wave .45s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-18deg)}to{transform:rotate(14deg)}}
.puff{position:absolute;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,rgba(230,230,230,.9),rgba(200,200,200,0) 70%);animation:puff .9s ease-out forwards}
@keyframes puff{to{transform:translate(var(--dx),-60px) scale(2.6);opacity:0}}
</style>
</head>

<script>
/* =================== CONFIG — edit this part =================== */
const CONFIG = {
  // Seconds between random surprises (prototype is short so you see it; real install maybe 180–480)
  minGap: 15, maxGap: 35,
  // How often each surprise comes up, relative to the others
  weights: { peek: 12, drive: 12, laser: 9, bowling: 7, invasion: 7, bumper: 7, pitstop: 7, flyby: 7, flag: 6, playcard: 6,
             tsunami: 6, fireworks: 6, burn: 5, crack: 5, confetti: 5, blackout: 5, glitch: 4 },
  // Every word the surprises put on screen. Change the wording here.
  text: {
    laserTitle:   ['LASER', 'TAG'],
    laserTagline: ['BOOK YOUR', 'GAME TODAY!'],
    laserNames:   ['DEO', 'HOT DOG'],            // used in "DEO WINS!"
    bowling:      ['STRIKE!', "LET'S BOWL!"],
    invasion:     ['HIGH', 'SCORE!'],
    flag:         ['KARTING', 'RACE TODAY!'],
    bonk:         'BONK!',
    flyby:        'BOOK YOUR PARTY TODAY!',
    pitstop:      ['★ THE PITSTOP ★', 'HOT DOG<br>BREAK!', 'Dogs & Subs — grab one now'],
    playcard:     ['DEZERLAND PARK', 'PLAYCARD', 'ARCADE • BOWLING • KARTING'],
    neon:         ['ARCADE', 'BOWLING', 'KARTING', 'LASER<br>TAG'],
  },
  burnSeconds: 4.5,
  // Each set = what plays on Screen 1 | Screens 2+3 | Screen 4. Use {video:'media/file.mp4'} for real files.
  sets: [
    { left:{ph:'playcard'}, center:{ph:'burst'}, right:{ph:'arcade'} },
    { left:{ph:'bowling'},  center:{ph:'deal'},  right:{ph:'kart'} },
  ]
};
/* =============================================================== */

const PH = {
  playcard:`<div class="ph p-playcard"><div class="big">GET YOUR<br>PLAYCARD<br>HERE</div><div class="marquee">ARCADE • BOWLING • KARTING • LASER TAG • BUMPER CARS • POOL • &nbsp;ARCADE • BOWLING • KARTING • LASER TAG • BUMPER CARS • POOL • &nbsp;</div><div class="tag">SCREEN 1 · VIDEO</div></div>`,
  burst:`<div class="ph p-burst"><div class="rays"></div><div class="vig"></div><div class="big">GET<br>PLAYCARD<br>HERE</div><div class="tag">SCREENS 2+3 · WIDE VIDEO</div></div>`,
  arcade:`<div class="ph p-arcade"><div class="sun"></div><div class="grid"></div><div class="big">ARCADE</div><div class="sub">PIXEL GAMES</div><div class="tag">SCREEN 4 · VIDEO</div></div>`,
  bowling:`<div class="ph p-bowling"><div class="lane"></div><div class="ball"></div><div class="big">BOWLING</div><div class="sub">ORLANDO</div><div class="tag">SCREEN 1 · VIDEO</div></div>`,
  deal:`<div class="ph p-deal"><div class="stripes"></div><div class="chev" style="left:0"></div><div class="chev" style="right:0"></div><div class="get">GET</div><div class="amt">$100</div><div class="free">FREE</div><div class="fine">When you purchase a $200 Playcard</div><div class="tag" style="left:150px">SCREENS 2+3 · WIDE VIDEO</div></div>`,
  kart:`<div class="ph p-kart"><div class="panel"><div class="big">KARTING</div><div class="sub">PRO TRACK · CADET TRACK</div></div><div class="tag" style="color:#000">SCREEN 4 · VIDEO</div></div>`,
};



/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const rand = (a,b) => a + Math.random()*(b-a);
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const stage = $('stage');
const kiosk = location.hash === '#kiosk';
if (kiosk) document.body.classList.add('kiosk','nobezel');

/* ---------- content layers ---------- */
let cur = $('layerA'), nxt = $('layerB'), setIdx = 0;
function slotHTML(item, cls){
  if (item.video) return `<div class="slot ${cls}"><video src="${item.video}" muted autoplay loop playsinline></video></div>`;
  return `<div class="slot ${cls}">${PH[item.ph]||''}</div>`;
}
function loadSet(layer, i){
  const s = CONFIG.sets[i % CONFIG.sets.length];
  layer.innerHTML = slotHTML(s.left,'left') + slotHTML(s.center,'center') + slotHTML(s.right,'right');
}
loadSet(cur, 0); loadSet(nxt, 1);
cur.style.zIndex = 2; nxt.style.zIndex = 1;


/* ---------- scaling / preview ---------- */
let zoom = false;
function fit(){
  const uiH = kiosk ? 0 : $('ui').offsetHeight + $('info').offsetHeight;
  const vw = innerWidth, vh = innerHeight - uiH;
  let s = Math.min(vw/7680, vh/1080);
  if (zoom && !kiosk) s = Math.max(s, Math.min(vh*0.95/1080, 0.5));
  stage.style.transform = `scale(${s})`;
  $('stageBox').style.width = 7680*s + 'px';
  $('stageBox').style.height = 1080*s + 'px';
}
addEventListener('resize', fit); fit();
document.fonts && document.fonts.ready.then(fit);

const TXT = CONFIG.text;

function kartSVG(c){

  const steer = c.wheel ? `<line x1="700" y1="160" x2="${c.wheel[0]+4}" y2="${c.wheel[1]+20}" stroke="#222" stroke-width="14" stroke-linecap="round"/><ellipse cx="${c.wheel[0]}" cy="${c.wheel[1]}" rx="17" ry="56" fill="#222" stroke="#000" stroke-width="6" transform="rotate(-14 ${c.wheel[0]} ${c.wheel[1]})"/>` : '';
  return `<svg viewBox="0 0 900 390" width="900" height="390" xmlns="http://www.w3.org/2000/svg">
  <ellipse cx="450" cy="378" rx="400" ry="12" fill="rgba(0,0,0,.4)"/>
  <rect x="62" y="96" width="26" height="80" fill="#222"/><rect x="20" y="70" width="150" height="30" rx="8" fill="${c.accent}" stroke="#000" stroke-width="6"/>
  <rect x="14" y="252" width="60" height="22" rx="8" fill="#888" stroke="#000" stroke-width="6"/>
  ${steer}
  <path d="M60 252 L100 150 L640 150 L852 238 Q872 250 866 300 L76 312 Z" fill="${c.body}" stroke="#000" stroke-width="8" stroke-linejoin="round"/>
  <path d="M96 210 L770 222 L840 252 L80 244 Z" fill="${c.accent}"/>
  <path d="M110 172 L640 172" stroke="rgba(255,255,255,.35)" stroke-width="10" stroke-linecap="round"/>
  <circle cx="440" cy="232" r="52" fill="#fff" stroke="#000" stroke-width="6"/>
  <text x="440" y="258" font-family="Bungee,Impact,sans-serif" font-size="72" text-anchor="middle" fill="#000"${c.flip ? ' transform="translate(880,0) scale(-1,1)"' : ''}>${c.num}</text>
  ${wheel(190,300,85)}${wheel(720,315,70)}
  </svg>`;
}
function bumperSVG(c){

function makeRig(key, flip, vehicle){
  let c = CHARS[key]; const el = document.createElement('div');
  if (flip) c = { ...c, flip: true, wheel: null, left: 900 - c.left - c.w };
  el.className = 'rig';
  el.innerHTML = `<div class="bob"><div class="clip" style="left:${c.left}px;top:${c.top}px;width:${c.w}px;height:${c.clip}px"><img src="${c.img}" alt=""></div>${vehicle === 'bumper' ? bumperSVG(c).replace('overflow:visible', 'overflow:visible' + (flip ? ';transform:scaleX(-1)' : '')) : flip ? kartSVG(c).replace('<svg ', '<svg style="transform:scaleX(-1)" ') : kartSVG(c)}</div>`;
  if (vehicle === 'bumper') el.querySelector('.bob').style.animation = 'none';
  $('mascotLayer').appendChild(el);
  return el;
}
function puff(x, y){
  const d = document.createElement('div');
  d.className = 'puff'; d.style.left = (x-35)+'px'; d.style.top = (y-35)+'px';
  d.style.setProperty('--dx', (-rand(60,140))+'px');
  $('mascotLayer').appendChild(d);
  setTimeout(() => d.remove(), 950);
}
function runDrive(actors, dur){
  return new Promise(res => {
    actors.forEach(a => a.el = makeRig(a.key));
    const t0 = performance.now(); let lastPuff = 0;
    (function frame(now){
      const p = Math.min(1, Math.max(0, (now-t0)/dur)), doPuff = now-lastPuff > 100;
      for (const a of actors){
        const x = a.x(p), y = a.y(p), r = a.rot ? a.rot(p) : 0, sc = a.scale || 1;
        a.el.style.transform = `translate(${x}px,${y}px) rotate(${r}deg) scale(${sc})`;
        a.el.style.zIndex = Math.round(y + 100*sc);
        if (doPuff) puff(x + 190 - 150*sc, y + 630 + 20*sc);
      }
      if (doPuff) lastPuff = now;
      if (p < 1) requestAnimationFrame(frame); else { actors.forEach(a => a.el.remove()); res(); }
    })(t0);
  });
}
// Karts drive left-to-right only for now: the art is front-facing, and flipping it would mirror the logos.
async function driveMascot(){
  if (busy) return; busy = true;
  const kind = pick(['solo','solo','race','chase']);
  const Y = 335, keys = Math.random() < .5 ? ['deo','dog'] : ['dog','deo'];
  const lin = (a,b) => p => a + (b-a)*p;
  if (kind === 'solo'){
    const style = pick(['cruise','wheelie','zigzag','boost']), x = lin(-960, 7740);
    await runDrive([{ key: keys[0],
      x: style==='boost' ? p => x(p*p) : x,
      y: style==='zigzag' ? p => Y - 50 + Math.sin(p*Math.PI*6)*60 : () => Y,
      rot: style==='wheelie' ? p => (p>.3 && p<.7 ? -14*Math.sin((p-.3)/.4*Math.PI) : 0) : null,
    }], rand(7500,10000) * (style==='boost' ? .6 : 1));
  } else if (kind === 'race'){
    const x = lin(-1400, 8200), sw = p => 430*Math.sin(p*Math.PI*3);
    await runDrive([
      { key: keys[0], scale: .86, x: p => x(p) + sw(p) - 250*p, y: () => Y - 40 },
      { key: keys[1], scale: 1,   x: p => x(p) - sw(p) + 250*p, y: () => Y + 10 },
    ], 10500);
  } else {
    const x = lin(-1900, 8700);
    await runDrive([
      { key: keys[0], x: p => x(p) + 520, y: p => Y - 30 + Math.sin(p*Math.PI*8)*45 },
      { key: keys[1], x: p => x(p) - 520 + 260*Math.sin(p*Math.PI*4), y: () => Y },
    ], 10000);
  }
  busy = false;
}

const fx = $('fx'), FXW = 2560, FXH = 360;
fx.width = FXW; fx.height = FXH;
const xc = fx.getContext('2d');
function fxDone(){
  xc.globalCompositeOperation = 'source-over'; xc.clearRect(0,0,FXW,FXH);
  fx.style.display = 'none'; busy = false;
}
function fireworks(){
  if (busy) return; busy = true;
  const dim = $('fxDim'), D = 9000, t0 = performance.now();
  dim.animate([{opacity:0},{opacity:1}],{duration:600,fill:'forwards'});

/* ---------- burn transition ---------- */
const FW=960, FH=135, MW=480, MH=68;
const fire = $('fire'); fire.width=FW; fire.height=FH;
const fctx = fire.getContext('2d');
const maskC = document.createElement('canvas'); maskC.width=MW; maskC.height=MH;
const mctx = maskC.getContext('2d');
const fireImg = fctx.createImageData(FW,FH), maskImg = mctx.createImageData(MW,MH);
const field = new Float32Array(FW*FH);

function hash(x,y,s){ let h = Math.imul(x,374761393) ^ Math.imul(y,668265263) ^ Math.imul(s,982451653);
  h = Math.imul(h ^ (h>>>13), 1274126177); h ^= h>>>16; return (h>>>0)/4294967296; }
function vnoise(x,y,s){ const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash(xi,yi,s), b=hash(xi+1,yi,s), c=hash(xi,yi+1,s), d=hash(xi+1,yi+1,s);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v; }
function buildField(){
  const seed = (Math.random()*1e6)|0;
  const pts = [0,1,2,3].map(i => [(i*1920 + rand(300,1620))/8, rand(15,120)]);
  let mn=1e9, mx=-1e9;
  for (let y=0;y<FH;y++) for (let x=0;x<FW;x++){
    let dist = 1e9;
    for (const [px,py] of pts){ const dd = Math.hypot(x-px, y-py); if (dd<dist) dist=dd; }
    let f=0, amp=.5, fr=1/28;
    for (let o=0;o<4;o++){ f += amp*vnoise(x*fr, y*fr, seed+o); amp*=.5; fr*=2; }
    const n = dist/150*0.62 + f*0.38;
    field[y*FW+x] = n; if(n<mn)mn=n; if(n>mx)mx=n;
  }
  for (let i=0;i<field.length;i++) field[i] = (field[i]-mn)/(mx-mn);
}
let embers = [];
function renderBurn(t){
  const fd = fireImg.data;
  for (let i=0, p=0; i<field.length; i++, p+=4){
    const d = field[i] - t; let r=0,g=0,b=0,a=0;
    if (d < 0){
      if (d > -0.05){ const k = 1 + d/0.05; r=255; g=60+80*k; b=10; a=190*k*k*(0.7+Math.random()*0.3); }
    } else if (d < 0.022){
      const k = d/0.022; r=255; g=255-k*130; b=210*(1-k)*(1-k); a=255;
      if (Math.random() < 0.0025 && embers.length < 500)
        embers.push({x:i%FW, y:(i/FW)|0, vx:rand(-.4,.4), vy:rand(-1.4,-.4), life:1});
    } else if (d < 0.09){
      const k = (d-0.022)/0.068; r=35; g=15; b=4; a=235*(1-k)*(1-k*.3);
    }
    fd[p]=r; fd[p+1]=g; fd[p+2]=b; fd[p+3]=a;
  }
  fctx.putImageData(fireImg,0,0);
  drawEmbers();
  const md = maskImg.data;
  for (let y=0;y<MH;y++) for (let x=0;x<MW;x++){
    const fi = Math.min(FH-1,y*2)*FW + x*2;
    md[(y*MW+x)*4+3] = field[fi] > t ? 255 : 0;
  }
  mctx.putImageData(maskImg,0,0);
  const url = `url(${maskC.toDataURL()})`;
  cur.style.webkitMaskImage = url; cur.style.maskImage = url;
}
function drawEmbers(){
  embers = embers.filter(e => (e.life -= 0.02) > 0);
  for (const e of embers){
    e.x += e.vx; e.y += e.vy; e.vx += rand(-.08,.08);
    fctx.fillStyle = `rgba(255,${150+100*e.life|0},60,${e.life})`;
    fctx.fillRect(e.x, e.y, 1, 1);
  }
}
function burn(){
  if (busy) return; busy = true;
  buildField();
  nxt.querySelectorAll('video').forEach(v => { v.currentTime = 0; v.play().catch(()=>{}); });
  fire.style.display = 'block';
  const start = performance.now(), D = CONFIG.burnSeconds*1000;
  function frame(now){
    const p = Math.min(1, (now-start)/D);
    const t = -0.03 + 1.15 * (p<.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2) ;
    renderBurn(t);
    if (p < 1) return requestAnimationFrame(frame);
    // swap layers
    cur.style.webkitMaskImage = cur.style.maskImage = '';
    const old = cur; cur = nxt; nxt = old;
    cur.style.zIndex = 2; nxt.style.zIndex = 1;
    setIdx = (setIdx+1) % CONFIG.sets.length;
    loadSet(nxt, setIdx+1);
    // let embers finish
    const fadeStart = performance.now();
    (function tail(n){
      fctx.clearRect(0,0,FW,FH); drawEmbers();
      if (n - fadeStart < 1000 && embers.length) return requestAnimationFrame(tail);
      fctx.clearRect(0,0,FW,FH); fire.style.display='none'; embers=[]; busy=false;
    })(performance.now());
  }
  requestAnimationFrame(frame);
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

    ltLayer.appendChild(beam);
    const dur = end/11;  // px per ms
    from.dodge.animate([{transform:'translateX(0)'},{transform:`translateX(${-ux*34}px) rotate(${-ux*3}deg)`},{transform:'translateX(0)'}],{duration:220});
    ltBurst(mx, my, from.color, .45);
    if (!hit) to.dodge.animate([{transform:'translateY(0)'},{transform:'translateY(520px)',offset:.3},{transform:'translateY(520px)',offset:.65},{transform:'translateY(0)'}],{duration:900,easing:'ease-in-out'});

const LABELS = { drive: '🏎️ Kart drive (solo / race / chase)', laser: '🔫 Laser tag battle', bowling: '🎳 Bowling strike', invasion: '👾 Arcade invasion', bumper: '💥 Bumper cars',
  pitstop: '🌭 Pit stop', flyby: '🦸 Deo flyby banner', flag: '🏁 Checkered flag', playcard: '💳 Playcard swipe', peek: '👀 Peek', tsunami: '🌊 Tsunami', fireworks: '🎆 Fireworks',
  burn: '🔥 Burn transition', crack: '🪟 Screen crack', confetti: '🎉 Confetti cannons', blackout: '💡 Blackout + neon', glitch: '📺 Glitch' };
function randomEvent(){
  const w = CONFIG.weights; let r = Math.random() * Object.values(w).reduce((a,b) => a+b, 0);
  for (const k in w){ if ((r -= w[k]) < 0) return EVENTS[k](); }
}
let nextAt = 0;
const schedule = () => nextAt = Date.now() + rand(CONFIG.minGap, CONFIG.maxGap)*1000;
schedule();
setInterval(() => {
  const left = Math.max(0, Math.ceil((nextAt-Date.now())/1000));
  $('status').textContent = busy ? 'Surprise in progress…' : `Next random surprise in ${left}s`;
  if (!busy && Date.now() >= nextAt){
    randomEvent();
    schedule();
  }
}, 250);

/* ---------- buttons ---------- */
let queued = null;
setInterval(() => { if (queued && !busy){ const f = queued; queued = null; f(); schedule(); } }, 100);
$('selFx').innerHTML = Object.keys(EVENTS).map(k => `<option value="${k}">${LABELS[k]}</option>`).join('');
$('bPlay').onclick = () => { queued = EVENTS[$('selFx').value]; };
$('bZoom').onclick = () => { zoom = !zoom; $('bZoom').textContent = zoom ? '🔍 Fit' : '🔍 Zoom'; fit(); };
$('bBez').onclick = () => { const off = document.body.classList.toggle('nobezel'); $('bBez').textContent = 'Bezels: ' + (off?'off':'on'); };
setTimeout(driveMascot, 1500); // show it off right away
</script>
</body>
</html>
